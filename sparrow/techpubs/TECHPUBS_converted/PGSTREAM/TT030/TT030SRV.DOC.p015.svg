<g><rect x="6912" y="6912" width="46796" height="28510" fill="#fff" stroke="none"/><text y="7881.2" xml:space="preserve"><tspan x="6912 7612.6 7962.8 8663.4 9013.7 9714.2 10064.5 10765.1 11115.4 12164.9 12515.2 13424.9 13775.2 14125.5 14475.8" font-size="1200" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-weight="bold">2.4.1.2 MIDI IN</tspan></text><text y="11481.2" xml:space="preserve"><tspan x="6912 7612.6 7962.8 14112 14812.6 15442.6 16072.6 16632 16982.3 17332.6 17962.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-weight="bold" text-decoration="underline">PinFunction</tspan></text><text y="13881.2" xml:space="preserve"><tspan x="6912 14112 14978.4 15578.4 15912 16212 17012.4 17612.4 18212.4 18812.4 19345.2 19878 20211.6 20744.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">1Not Connected</tspan></text><text y="15081.2" xml:space="preserve"><tspan x="6912 14112 14978.4 15578.4 15912 16212 17012.4 17612.4 18212.4 18812.4 19345.2 19878 20211.6 20744.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">2Not Connected</tspan></text><text y="16281.2" xml:space="preserve"><tspan x="6912 14112 14978.4 15578.4 15912 16212 17012.4 17612.4 18212.4 18812.4 19345.2 19878 20211.6 20744.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">3Not Connected</tspan></text><text y="17481.2" xml:space="preserve"><tspan x="6912 14112 14511.6 15378 15678 16478.4 17011.2 17544 18076.8 18410.4 19010.4 19543.2 19843.2 20709.6 21242.4 21576" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">4IN Receive Data</tspan></text><text y="18681.2" xml:space="preserve"><tspan x="6912 14112 14511.6 15378 15678 16411.2 17011.2 17611.2 18211.2 18511.2 19311.6 19844.4 20178 20778 21177.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">5IN Loop Return</tspan></text><text y="22442.8" xml:space="preserve"><tspan x="6912 7729.3 8138 8955.3 9364 10181.3 10589.9 11570.4 12631.8 13612.3 14020.9 14429.6 14838.2 15655.6 16064.2 16881.5 17371 17779.7 18597 19332" font-size="1400" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-weight="bold">2.4.2 SCSI Interface</tspan></text><text y="26081.2" xml:space="preserve"><tspan x="6912 7645.2 8245.2 8778 9078 9811.2 10544.4 11144.4 11744.4 12344.4 12644.4 12978 13911.6 14511.6 14845.2 15378 16311.6 16844.4 17444.4 17778 18244.8 18544.8 19077.6 19377.6 19844.4 20178 20778 21378 21711.6 22244.4 22644 23176.8 23776.8 24376.8 24909.6 25509.6 25809.6 26209.2 26809.2 27409.2 28009.2 28408.8 29008.8 29342.4 29742 30141.6 30674.4 31074 31606.8 32206.8 32540.4 32874 33406.8 33740.4 34140 34440 35107.2 35907.6 36574.8 36974.4 37274.4 37874.4 38474.4 38941.2 39241.2 39841.2 40308 40641.6 41241.6 41841.6 42141.6 42674.4 42974.4 43574.4 44174.4 44774.4 45374.4 45674.4 46341.6 47142 47809.2 48208.8 48508.8 49041.6 49641.6 50241.6 50575.2 50974.8 51574.8 51908.4 52242 52774.8 53174.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">The TT030 implements a single-ended (non-differential) SCSI bus using a 5380 SCSI controller.</tspan></text><text y="27281.2" xml:space="preserve"><tspan x="6912 7645.2 8245.2 8778 9078 9610.8 10210.8 10810.8 11144.4 11544 12144 12477.6 12811.2 13344 13743.6 14043.6 14576.4 15109.2 15709.2 16009.2 16408.8 16941.6 17474.4 17808 18141.6 18475.2 18808.8 19341.6 19675.2 20208 20508 21108 21507.6 22107.6 22441.2 22774.8 23074.8 23674.8 24207.6 24541.2 25074 25374 25707.6 26107.2 26640 27240 27706.8 28106.4 28639.2 29038.8 29505.6 29805.6 30338.4 30672 30972 31371.6 31904.4 32238 32770.8 33237.6 33537.6 34137.6 34737.6 35037.6 35371.2 35971.2 36271.2 36871.2 37171.2 38238 38838 39438 39771.6 40304.4 40771.2 41071.2 41671.2 42204 42603.6 42903.6 43370.4 43903.2 44436 45036 45636 46236 46536 46836 47569.2 48169.2 48702 49002 49669.2 50469.6 51136.8 51536.4 51836.4 52436.4 53036.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">The controller can facilitate 8-bit data transfers at rates up to 4 Mbytes per second. The SCSI bus</tspan></text><text y="28481.2" xml:space="preserve"><tspan x="6912 7444.8 7977.6 8577.6 8877.6 9344.4 9944.4 10544.4 11144.4 11744.4 12144 12477.6 12777.6 13377.6 13977.6 14277.6 14611.2 15211.2 15511.2 16111.2 16411.2 17344.8 17877.6 18211.2 18811.2 19210.8 19510.8 20110.8 20643.6 21243.6 21577.2 22110 22642.8 23109.6 23409.6 23743.2 24343.2 24643.2 25176 25776 26376 26709.6 27043.2 27376.8 27976.8 28576.8 28876.8 29210.4 29810.4 30110.4 30444 31044 31576.8 31876.8 32610 33343.2 33943.2 34543.2 35143.2 35443.2 35743.2 36476.4 37076.4 37609.2 37909.2 38576.4 39376.8 40044 40443.6 40743.6 41276.4 41876.4 42476.4 43076.4 43609.2 44142 44475.6 45075.6 45475.2 45775.2 46375.2 46774.8 47374.8 47974.8 48308.4 48908.4 49441.2 49908 50208 50607.6 51207.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">can support up to 7 major devices in addition to the TT030. The SCSI connector provides for</tspan></text><text y="29681.2" xml:space="preserve"><tspan x="6912 7444.8 8044.8 8644.8 9244.8 9777.6 10310.4 10644 10977.6 11577.6 12177.6 12477.6 13077.6 13477.2 13777.2 14444.4 15244.8 15912 16311.6 16611.6 17144.4 17744.4 18678 19278 19810.8 20144.4 20478 21078 21411.6 21944.4 22244.4 22844.4 23377.2 23977.2 24310.8 24843.6 25376.4 25843.2 26143.2 26476.8 27076.8 27476.4 28076.4 28676.4 29276.4 29876.4 30176.4 30709.2 31009.2 31609.2 32209.2 32608.8 33208.8 33542.4 34142.4 34442.4 35308.8 35608.8 35942.4 36542.4 37142.4 37675.2 37975.2 38508 39108 39708 40308 40840.8 41373.6 41707.2 42307.2 42706.8 43006.8 43306.8 43706.4 44306.4 44640 45172.8 45572.4 46172.4 46705.2 47038.8 47372.4 47972.4 48272.4 48805.2 49105.2 49504.8 50104.8 50438.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">connection of SCSI compatible devices through a 25-pin D type connector. Internally a full</tspan></text><text y="30881.2" xml:space="preserve"><tspan x="6912 7512 8112 8511.6 9111.6 9445.2 10045.2 10345.2 10744.8 11078.4 11611.2 11944.8 12244.8 12777.6 13310.4 13910.4 14244 14776.8 15076.8 15410.4 15877.2 16177.2 16777.2 17244 17776.8 18376.8 18676.8 18976.8 19710 20310 20842.8 21142.8 21742.8 22275.6 22675.2 23208 23808 24141.6 24475.2 24775.2 25375.2 25908 26307.6 26907.6 27207.6 27807.6 28141.2 28608 29208 29508 30374.4 30708 31041.6 31375.2 31675.2 32275.2 32808 33108 33640.8 34240.8 34840.8 35240.4 35574 36174 36774 37173.6 37706.4 38306.4 38606.4 39139.2 39606 39906 40573.2 41373.6 42040.8 42440.4 42740.4 43606.8 44206.8 44540.4 44874 45174 45774 46074 46374 46974 47506.8 48106.8 48440.4 48973.2 49506 49806 50406" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">50-pin flat cable is used. The default hard disk will be configured as SCSI Unit 0, device 0.</tspan></text></g>

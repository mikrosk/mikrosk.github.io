 Button</tspan></text><text y="20167.2" xml:space="preserve"><tspan x="7200 14400 15076.8 15676.8 16543.2 17409.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">7+5VDC</tspan></text><text y="21367.2" xml:space="preserve"><tspan x="7200 14400 15266.4 15666 16266 16866 17466" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">8Ground</tspan></text><text y="22567.2" xml:space="preserve"><tspan x="7200 14400 15266.4 15866.4 16200 16500 17300.4 17900.4 18500.4 19100.4 19633.2 20166 20499.6 21032.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">9Not Connected</tspan></text><text y="26328.8" xml:space="preserve"><tspan x="7200 8017.3 8426 9243.3 9652 10469.3 10877.9 11939.3 13082.9 14307.5 14716.1 15777.5 16594.8 17084.3 17492.9 17982.5 18308.8 19126.1 19943.4" font-size="1400" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-weight="bold">2.4.9 ROM Cartridge</tspan></text><text y="29967.2" xml:space="preserve"><tspan x="7200 7933.2 8533.2 9066 9366 10099.2 10832.4 11432.4 12032.4 12632.4 12932.4 13465.2 14065.2 14665.2 14998.8 15531.6 15865.2 16465.2 16932 17232 17764.8 18064.8 18865.2 19731.6 20798.4 21098.4 21631.2 22164 22563.6 22897.2 23296.8 23630.4 24230.4 24830.4 25363.2 25663.2 26263.2 26863.2 27262.8 27596.4 27896.4 28230 28830 29362.8 29696.4 29996.4 30330 30796.8 31096.8 31496.4 32096.4 32430 32763.6 33363.6 33663.6 34196.4 34796.4 35730 36330 36862.8 37196.4 37530 38130 38463.6 38996.4 39296.4 40162.8 40496.4 40830 41430 41730 42063.6 42663.6 43196.4 43496.4 44362.8 44696.4 45229.2 45628.8 45962.4 46262.4 46929.6 47662.8 47962.8 48495.6 49028.4 49428 49761.6 50161.2 50494.8 51094.8 51694.8 52227.6 52694.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">The TT030 contains a ROM cartridge port that is fully compatible with the Atari ST cartridges.</tspan></text><text y="31167.2" xml:space="preserve"><tspan x="7200 7933.2 8533.2 9066 9366 9898.8 10431.6 10831.2 11164.8 11564.4 11898 12498 13098 13630.8 13930.8 14264.4 14731.2 15031.2 15631.2 16231.2 16831.2 17298 17631.6 18164.4 18697.2 19030.8 19364.4 19964.4 20264.4 20797.2 21397.2 21997.2 22597.2 23130 23662.8 23996.4 24529.2 25129.2 25429.2 25762.8 26362.8 26762.4 27362.4 27962.4 28562.4 29162.4 29462.4 29995.2 30295.2 30895.2 31495.2 31894.8 32494.8 32828.4 33428.4 33728.4 34261.2 34861.2 35461.2 35994 36294 36826.8 37426.8 38026.8 38626.8 39159.6 39692.4 40026 40626 41025.6 41325.6 41659.2 42259.2 42792 43324.8 43658.4 44191.2 44791.2 45091.2 45691.2 46291.2 46591.2 46924.8 47524.8 48057.6 48357.6 48691.2 49224 49623.6 49957.2 50257.2 50724 51057.6 51657.6 52190.4 52490.4 53090.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">The cartridge is physically connected through a 40-pin edge connector located on the left side of</tspan></text><text y="32367.2" xml:space="preserve"><tspan x="7200 7533.6 8133.6 8666.4 8966.4 9499.2 10032 10498.8 11031.6 11331.6 11631.6 12432 13298.4 14365.2 14665.2 15198 15730.8 16130.4 16464 16863.6 17197.2 17797.2 18397.2 18930 19396.8 19696.8 20229.6 20629.2 21162 21462 22395.6 22928.4 23528.4 24128.4 24661.2 25261.2 25561.2 25894.8 26494.8 26794.8 27327.6 27627.6 28227.6 28827.6 29427.6 29727.6 30594 31194 31794 32127.6 32660.4 32960.4 33493.2 33892.8 34425.6 34958.4 35258.4 35725.2 36058.8 36591.6 36991.2 37324.8 37658.4 38258.4 38858.4 39158.4 39691.2 40024.8 40324.8 40857.6 41457.6 42057.6 42457.2 42990 43456.8 43923.6 44223.6 44890.8 45757.2 46357.2 46957.2 47557.2 48157.2 48457.2 48990 49590" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">the case. ROM cartridges are mapped to a 128 Kbyte area starting at address FA0000 and</tspan></text><text y="33567.2" xml:space="preserve"><tspan x="7200 7732.8 8332.8 8666.4 9199.2 9799.2 10399.2 10732.8 11332.8 11932.8 12232.8 12566.4 13166.4 13466.4 14133.6 14934 15534 16201.2 16868.4 17535.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">extending to FB8FFF.</tspan></text><text y="37328.8" xml:space="preserve"><tspan x="7200 8017.3 8426 9243.3 9652 10469.3 11286.6 11695.3 12675.8 13900.3 14880.8 15698.1 16515.4" font-size="1400" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-weight="bold">2.4.10 VMEbus</tspan></text><text y="40967.2" xml:space="preserve"><tspan x="7200 7933.2 8533.2 9066 9366 10232.4 11299.2 12032.4 12332.4 12932.4 13532.4 13999.2 14299.2 14632.8 15099.6 15399.6 15999.6 16399.2 16999.2 17599.2 17932.8 18532.8 19065.6 19665.6 19965.6 20299.2 20899.2 21199.2 21732 22065.6 22399.2 22999.2 23865.6 24165.6 24565.2 25165.2 25564.8 25864.8 26331.6 26931.6 27398.4 27732 28264.8 29198.4 29498.4 30031.2 30631.2 31231.2 31764 32364 32830.8 33164.4 33764.4 34364.4 34664.4 35197.2 35797.2 36397.2 36697.2 37230 37830 38430 38829.6 39429.6 39829.2 40762.8 41229.6 41529.6 41863.2 42463.2 42763.2 43096.8 43696.8 44296.8 44896.8 45363.6 45697.2 46096.8 46696.8 46996.8 47463.6 47797.2 48330 48930 49530 50062.8 50462.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">The VME bus is provided to allow for system expansion and conforms to industry standard</tspan></text><text y="42167.2" xml:space="preserve"><tspan x="7200 8066.4 9133.2 9866.4 10166.4 10766.4 11366.4 11833.2 12133.2 12532.8 13065.6 13665.6 13999.2 14466 14799.6 15399.6 15999.6 16299.6 17100 17400 18000 18300 18600 18999.6 19599.6 19933.2 20466 20865.6 21265.2 21865.2 22465.2 22798.8 23265.6 23565.6 23965.2 24765.6 25632 26232 26631.6 27031.2 27831.6 28698 29298 29598 30130.8 30530.4 31063.2 31363.2 31696.8 32296.8 32630.4 33163.2 33562.8 33962.4 34495.2 35028 35560.8 36160.8 36460.8 36993.6 37593.6 38193.6 38493.6 39026.4 39426 40026 40359.6 40693.2 41092.8 41625.6 41959.2 42492 43092 43392 43725.6 44325.6 44725.2 45325.2 45925.2 46525.2 47125.2 47425.2 47758.8 48358.8 48891.6 49191.6 49858.8 50659.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">VME bus revision C.1. Interrupts IRQ1-IRQ7 are interfaced and arbitrated through the SCU</tspan></text><text y="43367.2" xml:space="preserve"><tspan x="7200 7732.8 8332.8 8666.4 9266.4 9566.4 9866.4 10732.8 11032.8 11632.8 11966.4 12566.4 13166.4 13699.2 14032.8 14332.8 14932.8 15532.8 15832.8 16899.6 17766 18298.8 18598.8 19131.6 19465.2 20065.2 20598 21198 21498 21831.6 22298.4 22598.4 23198.4 23598 24198 24798 25131.6 25731.6 26264.4 26864.4 27164.4 27498 28098 28398 28731.6 29331.6 29864.4 30164.4 31030.8 32097.6 32830.8 33130.8 33730.8 34330.8 34797.6 35097.6 35697.6 36031.2 36564 36864 37197.6 37797.6 38330.4 38630.4 39363.6 40096.8 40963.2 41362.8 42229.2 42962.4 43828.8 44128.8 44661.6 45261.6 45595.2 46195.2 46495.2 47028 47628 48228 48528 49060.8 49360.8 49960.8 50560.8 51294 51961.2 52561.2 53161.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">chip. A global 16 MHz clock is provided to the VME bus via the TTVIDEO chip and a 74LS244</tspan></text><text y="44567.2" xml:space="preserve"><tspan x="7200 7533.6 8066.4 8400 8932.8 9532.8 9832.8 10132.8 10866 11466 11799.6 12266.4 12566.4 13166.4 13566 14166 14766 15099.6 15699.6 16232.4 16699.2 16999.2 17332.8 17932.8 18266.4 18799.2 19132.8 19432.8 19766.4 20366.4 20966.4 21499.2 22099.2 22632 23232 23832 24364.8 24964.8 25497.6 26030.4 26330.4 26930.4 27330 27630 27963.6 28563.6 29096.4 29396.4 29929.2 30262.8 30862.8 31395.6 31995.6 32295.6 32695.2 33094.8 33694.8 34628.4 34928.4 35262 35862 36394.8 36694.8 37294.8 37694.4 38294.4 38827.2 39360 39826.8 40293.6 40893.6 41293.2 41593.2 42060 42660 43192.8 43725.6 44325.6 44625.6 44925.6 45792 46092 46692 47292 47691.6 48291.6 48625.2 48958.8 49258.8 49791.6 50391.6 50991.6 51391.2 51924 52390.8" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">latch. This provides total independence of the clock from the processor speed. A 24-bit address</tspan></text><text y="45767.2" xml:space="preserve"><tspan x="7200 7800 8400 8866.8 9166.8 9466.8 10066.8 10666.8 11066.4 11666.4 12000 12333.6 12633.6 13233.6 13766.4 14100 14632.8 14932.8 15532.8 16132.8 16599.6 16899.6 17199.6 17732.4 18332.4 18932.4 19232.4 19765.2 20365.2 20965.2 21298.8 21698.4 22298.4 22632 22932 23398.8 23732.4 24332.4 24932.4 25465.2 25798.8 26265.6 26565.6 27098.4 27498 28030.8 28330.8 28930.8 29330.4 29930.4 30530.4 30864 31464 31996.8 32596.8 32896.8 33230.4 33830.4 34130.4 34464 35064 35596.8 35896.8 36763.2 37830 38563.2 39163.2 39763.2 40230 40530 41130 41463.6 41996.4 42296.4 42630 43230 43762.8 44062.8 45129.6 45930 46530 47130 47730 48330 48930 49329.6 49629.6 49929.6 50662.8 51262.8 51596.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">bus, 16-bit data bus, and control signals are provided to the VMEbus via the MC68030r. This</tspan></text><text y="46967.2" xml:space="preserve"><tspan x="7200 7732.8 8332.8 8932.8 9332.4 9666 10266 10866 11265.6 11798.4 12132 12465.6 13065.6 13665.6 13965.6 14498.4 15031.2 15631.2 16098 16630.8 17097.6 17397.6 17731.2 18331.2 18864 19164 20097.6 20630.4 20964 21564 21864 22330.8 22930.8 23397.6 23731.2 24264 25197.6 25497.6 26097.6 26697.6 27230.4 27630 28230 28530 28863.6 29463.6 29763.6 30296.4 30829.2 31162.8 31462.8 31995.6 32462.4 32762.4 33096 33696 34228.8 34528.8 35395.2 36462 37195.2 37495.2 38095.2 38695.2 39162 39462 39994.8 40594.8 41194.8 41528.4 41928 42528 42861.6 43195.2 43728 44127.6 44427.6 45294 45894 46426.8 47026.8 47326.8 47859.6 48159.6 48692.4 49225.2 49624.8 50224.8 50524.8 50858.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">configuration causes the main system board to act as the VME bus controller when a card is</tspan></text><text y="48167.2" xml:space="preserve"><tspan x="7200 7533.6 8133.6 8600.4 8934 9466.8 9800.4 10134 10666.8 11266.8 11566.8 11900.4 12500.4 12800.4 13134 13734 14266.8 14566.8 15166.8 15766.8 16233.6 16533.6 17000.4 17334 17934 18267.6 18734.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">installed in the bus slots.</tspan></text></g>

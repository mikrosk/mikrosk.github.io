x="7200 7800 14400 15532.8 15932.4 16266 16599.6 17132.4 17432.4 18099.6 18499.2 19099.2 19432.8 19965.6 20498.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">14Write Protect</tspan></text><text y="33530.8" xml:space="preserve"><tspan x="7200 8017.3 8426 9243.3 9652 10469.3 10877.9 11858.4 12919.8 13981.1 14389.8 15370.3 16187.6 16677.1 17003.4 17820.8 18147.1 18555.8 19536.2 20353.6 20843.1 21251.7 21986.7 22395.4 23456.7 24437.2 25254.5" font-size="1400" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-weight="bold">2.4.4 SCC Serial Ports UA04</tspan></text><text y="37169.2" xml:space="preserve"><tspan x="7200 7933.2 8533.2 9066 9366 10099.2 10832.4 11432.4 12032.4 12632.4 12932.4 13465.2 14065.2 14665.2 14998.8 15531.6 15865.2 16465.2 16932 17232 17764.8 18364.8 18664.8 19264.8 19864.8 20665.2 21265.2 21865.2 22165.2 22832.4 23365.2 23764.8 24098.4 24631.2 24964.8 25264.8 26065.2 26665.2 27598.8 28532.4 29132.4 29732.4 30066 30598.8 31131.6 31465.2 31798.8 32398.8 32998.8 33465.6 33765.6 34566 35166 35766 36099.6 36499.2 37099.2 37432.8 37766.4 38299.2 38698.8 38998.8 39398.4 40065.6 40866 41666.4 42066 42366 42699.6 43299.6 43832.4 44166 44466 45066 45465.6 46065.6 46665.6 46999.2 47599.2 48132 48598.8 48898.8 49431.6 49731.6 50331.6 50931.6 51464.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">The TT030 contains an 85C30 Serial Communications Controller (SCC) that provides a dual</tspan></text><text y="38369.2" xml:space="preserve"><tspan x="7200 7732.8 8332.8 8865.6 9465.6 10065.6 10598.4 10932 11232 11532 12465.6 13065.6 13399.2 13732.8 14066.4 14466 15066 15465.6 16065.6 16399.2 16999.2 17532 18132 18465.6 18765.6 19365.6 19898.4 20498.4 20832 21364.8 21897.6 22197.6 22531.2 23131.2 23664 23997.6 24297.6 24897.6 25297.2 25897.2 26497.2 26830.8 27430.8 27963.6 28430.4 28730.4 29064 29930.4 30530.4 30830.4 31297.2 31830 32229.6 32563.2 33096 33429.6 33729.6 34329.6 34929.6 35329.2 35662.8 36129.6 36429.6 36729.6 37396.8 37996.8 38396.4 38730 39030 39896.4 40196.4 40729.2 41262 41862 42162 42762 43294.8 43594.8 44194.8 44661.6 45194.4 45794.4 46094.4 46627.2 47094 47394 47926.8 48260.4 48594 49194 49726.8 50126.4 50426.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">channel, multi-protocol device that provides two serial ports. Port A can be used as either a</tspan></text><text y="39569.2" xml:space="preserve"><tspan x="7200 7800 8332.8 8666.4 9532.8 10132.8 10532.4 11132.4 11432.4 12032.4 12632.4 13032 13365.6 13665.6 14265.6 14665.2 14965.2 15498 15798 16264.8 16598.4 17131.2 17731.2 18331.2 18864 19263.6 19863.6 20163.6 20630.4 20964 21564 22430.4 22730.4 23197.2 23797.2 24330 24862.8 25462.8 25762.8 26563.2 27230.4 27630 28230 28830 29430 30230.4 30530.4 30997.2 31530 31929.6 32263.2 32796 33129.6 33429.6 34029.6 34629.6 35029.2 35362.8 35662.8 35962.8 36696 37296 37828.8 38128.8 38462.4 39062.4 39662.4 40262.4 40596 40929.6 41529.6 42129.6 42463.2 43063.2 43663.2 43996.8 44296.8 44896.8 45296.4 45596.4 46196.4 46796.4 47196 47529.6 47829.6 48696 48996 49329.6 49796.4 50096.4 50496 51096 51696 52029.6 52562.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">network port or a standard slow speed RS-232C serial port. The input/output of port A is routed</tspan></text><text y="40769.2" xml:space="preserve"><tspan x="7200 7533.6 8133.6 8433.6 8767.2 9367.2 9900 10200 10732.8 11332.8 11932.8 12332.4 12932.4 13532.4 13932 14265.6 14798.4 15132 15664.8 15964.8 16497.6 17097.6 17697.6 18297.6 18830.4 19363.2 19696.8 20296.8 20696.4 20996.4 21296.4 21829.2 22162.8 22496.4 23096.4 23629.2 24028.8 24328.8 24861.6 25461.6 25761.6 26361.6 26761.2 27361.2 27694.8 28294.8 28594.8 29528.4 29862 30462 30795.6 31195.2 32061.6 32461.2 33327.6 33627.6 34227.6 34627.2 34927.2 35793.6 36594 36993.6 37593.6 38260.8 38560.8 38860.8 39460.8 40060.8 40360.8 40827.6 41360.4 41694 42027.6 42361.2 42961.2 43561.2 43861.2 44394 44694 45294 45627.6 45961.2 46261.2 46594.8 47194.8 47494.8" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">to the appropriate connector, either an 8-pin mini-DIN or DB-9P, by setting a bit in a</tspan></text><text y="41969.2" xml:space="preserve"><tspan x="7200 7599.6 8132.4 8732.4 9066 9532.8 9866.4 10399.2 10798.8 11198.4 11798.4 12265.2 12798 13197.6 13497.6 14030.4 14630.4 15230.4 15564 15897.6 16430.4 16963.2 17296.8 17630.4 18230.4 18830.4 19130.4 19730.4 20130 20430 21296.4 21896.4 22429.2 22828.8 23361.6 23695.2 24028.8 24628.8 25228.8 25528.8 26196 26796 27262.8 27596.4 28129.2 29062.8 29462.4 29762.4 30062.4 30795.6 31395.6 31928.4 32228.4 32828.4 33428.4 33762 34362 34962 35295.6 35595.6 36195.6 36529.2 37129.2 37596 37896 38496 39096 39396 39729.6 40329.6 40862.4 41162.4 41762.4 42362.4 42829.2 43362 43695.6 44228.4 44761.2 45094.8 45627.6 46227.6 46527.6 47127.6 47727.6 48127.2 48460.8 48760.8 49160.4 49693.2 50626.8 51159.6 51493.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">register(user application or Operating System). The output pins on the unselected port remain</tspan></text><text y="43169.2" xml:space="preserve"><tspan x="7200 7533.6 8133.6 8666.4 9199.2 9532.8 9866.4 10466.4 10999.2 11299.2 11966.4 12566.4 12966 13299.6 13599.6 14400 14700 15033.6 15500.4 15800.4 16333.2 16933.2 17533.2 17932.8 18266.4 18866.4 19466.4 19866 20398.8 20998.8 21298.8 21632.4 22232.4 22532.4 23132.4 23665.2 23965.2 24498 24798 25131.6 25731.6 26598 26898 27364.8 27964.8 28497.6 29030.4 29630.4 29930.4 30397.2 30730.8 31263.6 31863.6 32463.6 32996.4 33396 33996 34296 35096.4 35763.6 36163.2 36763.2 37363.2 37963.2 38763.6 39063.6 39530.4 40063.2 40462.8 40796.4 41329.2 41662.8 41962.8 42562.8 43162.8 43562.4 43896 44196 44529.6 45129.6 45662.4 45996 46296 46828.8 47361.6 47961.6 48261.6 48861.6 49394.4 49694.4 50294.4 50761.2 51294 51894 52194 52593.6 53193.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">inactive Port B is configured to be a low speed standard RS-232C serial port that can be used for</tspan></text><text y="44369.2" xml:space="preserve"><tspan x="7200 7732.8 8332.8 8932.8 9532.8 10065.6 10598.4 10932 11265.6 11865.6 12465.6 12765.6 13298.4 13598.4 14532 15132 15732 16264.8 17198.4 17498.4 18098.4 18498 18798 19131.6 19731.6 20264.4 20797.2 21130.8 21430.8 22364.4 22897.2 23230.8 23830.8 24230.4 24630 25162.8 26096.4 26629.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">connecting a modem or local mainframe.</tspan></text><text y="46769.2" xml:space="preserve"><tspan x="7200 7933.2 8533.2 9066 9366 9699.6 10299.6 10899.6 11499.6 11833.2 12166.8 12766.8 13366.8 13700.4 14300.4 14900.4 15234 15534 16134 16533.6 16833.6 17500.8 18100.8 18500.4 18834 19134 19934.4 20234.4 20568 21034.8 21334.8 21867.6 22467.6 23067.6 23667.6 24200.4 24733.2 25066.8 25599.6 26199.6 26499.6 26833.2 27433.2 27733.2 28266 28566 29432.4 30232.8 30632.4 31232.4 31899.6 32199.6 32732.4 33332.4 33932.4 34532.4 35065.2 35598 35931.6 36531.6 36931.2 37231.2 37764 38364 38964 39264 40197.6 40797.6 41397.6 41930.4 42864 43164 43696.8 44296.8 44896.8 45230.4 45630 46230 46563.6 46863.6 47330.4 47664 48264 48864 49396.8 49730.4 50197.2 50497.2 51030 51429.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">The input/output of Port B is connected to a DB-9P connector and modem control signals are</tspan></text><text y="47969.2" xml:space="preserve"><tspan x="7200 7800 8332.8 8732.4 9066 9666 10198.8 10798.8 11098.8 11698.8 12032.4 12432 12964.8 13497.6 13831.2 14164.8 14764.8 15064.8 15464.4 15864 16464 17397.6 17697.6 18031.2 18631.2 19164 19464 20064 20664 21464.4 22064.4 22664.4 22964.4 23631.6 24231.6 24631.2 24964.8 25264.8 26065.2 26365.2 26898 27498 28098 28431.6 28831.2 29431.2 29764.8 30064.8 30398.4 30732 31332 31864.8 32331.6 32631.6 32931.6 33598.8 34198.8 34598.4 34932 35232 36032.4 36332.4 36865.2 37398 37998 38298 38830.8 39164.4 39631.2 40231.2 40531.2 41131.2 41731.2 42264 42663.6 43196.4 43530 44062.8 44362.8 45229.2 45562.8 45896.4 46496.4 46796.4 47263.2 47863.2 48196.8 48530.4 48864 49164 49497.6 49897.2 50430 51030 51496.8 52430.4 52764" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">derived directly from the 85C30 Port B control lines. Port B can also operate with split transmit</tspan></text><text y="49169.2" xml:space="preserve"><tspan x="7200 7732.8 8332.8 8932.8 9232.8 9632.4 10165.2 10698 11230.8 11564.4 12164.4 12697.2 12997.2 13597.2 14130 14730 15330 15630 16029.6 16562.4 16896 17428.8 17895.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">and receive baud rates.</tspan></text><text y="51569.2" xml:space="preserve"><tspan x="7200 7933.2 8533.2 9066 9366 10033.2 10833.6 11566.8 12433.2 12733.2 13066.8 13666.8 14266.8 14866.8 15200.4 15500.4 15834 16434 16734 17067.6 17667.6 18200.4 18500.4 19167.6 19968 20768.4 21068.4 21402 21868.8 22168.8 22568.4 23101.2 23434.8 23967.6 24567.6 24867.6 25400.4 25734 26034 26634 26934 28000.8 28867.2 29400 29700 30000 30733.2 31333.2 31866 32166 32966.4 33699.6 34566 35366.4 36232.8 36532.8 37065.6 37665.6 38265.6 38565.6 39366 40099.2 40965.6 41766 42566.4 42866.4 43200 43800 44400 45000 45333.6 45633.6 45967.2 46434 46734 47334 47733.6 48333.6 48933.6 49267.2 49867.2 50400 51000 51300 52166.4 52500 52833.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">The PCLK input to the SCC is rated at 8 MHz. The RTXCA and RTXCB input is provided with</tspan></text><text y="52769.2" xml:space="preserve"><tspan x="7200 7732.8 8032.8 8632.8 8932.8 9532.8 10132.8 10732.8 11032.8 12099.6 12966 13498.8 13798.8 14331.6 14665.2 15265.2 15798 16398 16698 16998 17731.2 18331.2 18864 19164 19897.2 20697.6 21564 22364.4 23230.8 23530.8 23864.4 24464.4 25064.4 25664.4 25998 26298 26830.8 27430.8 28364.4 28897.2 29364 29664 30063.6 30463.2 31063.2 31996.8 32296.8 32630.4 33230.4 33763.2 34063.2 34796.4 35662.8 36529.2 36829.2 37362 37962 38562 39162 39694.8 40227.6 40561.2 41161.2 41560.8 41860.8 42160.8 42693.6 43293.6 43893.6 44193.6 44527.2 45127.2 45660 45960 46693.2 47493.6 48360 49160.4 49960.8 50260.8 50594.4 51194.4 51794.4 52394.4 52728 53028 53361.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">a 1.672 MHz clock. The TRXCA input comes from the LAN connector, and the TRXCB input is</tspan></text><text y="53969.2" xml:space="preserve"><tspan x="7200 7599.6 8132.4 8466 8998.8 9598.8 9898.8 10431.6 10765.2 11065.2 11665.2 11965.2 12565.2 13165.2 13765.2 14365.2 14665.2 15732 16598.4 17131.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">rated at 2.4576 MHz.</tspan></text></g>

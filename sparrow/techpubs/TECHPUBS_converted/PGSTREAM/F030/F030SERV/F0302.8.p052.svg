 through a 40 pin card edge connector ROM cartridge slot. Cartridge ROMs</tspan></text><text y="40528.2" xml:space="preserve"><tspan x="7198 7730.8 8130.4 8663.2 8963.2 9896.8 10429.6 11029.6 11629.6 12162.4 12762.4 13062.4 13396 13996 14296 14828.8 15128.8 15728.8 16328.8 16928.8 17795.2 18095.2 19028.8 19561.6 20495.2 21095.2 21494.8 22094.8 22394.8 22794.4 23327.2 23927.2 24260.8 24860.8 25460.8 25760.8 26227.6 26561.2 27094 27493.6 27827.2 28160.8 28760.8 29360.8 29660.8 30193.6 30527.2 30827.2 31427.2 32027.2 32627.2 33227.2 33894.4 34760.8 35360.8 35960.8 36560.8 37160.8 37460.8 37760.8 38293.6 38893.6 39227.2 39760 40360 40960 41293.6 41893.6 42493.6 42793.6 43127.2 43727.2 44027.2 44627.2 45227.2 45827.2 46427.2 47094.4 47894.8 48562 49229.2 49896.4 50563.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">are mapped to a 128K memory region starting at 0x00FA0000, extending to 0x00FBFFFF.</tspan></text></g>

<g><rect x="46339" y="3811" width="27878" height="51942" fill="#fff" stroke="none"/><text y="4618.7" xml:space="preserve"><tspan x="56447.6 57106.4 57515 58224.2 58632.8 58892 59450.9 59909.9 60169.1 60577.7 60886.4 61145.6 61554.2 61813.4 62272.4 62981.6 63390.2 63849.2" font-size="900" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-style="italic">Game/Entertainment</tspan></text><text y="5618.7" xml:space="preserve"><tspan x="56505.7 57015.1 57474.1 57782.8 58041.9 58700.8 59109.3 59418.1 59826.7 60060.7 60719.4 61178.4 61437.7 61896.7 62305.2 62564.4 62823.7 63282.7 63691.2" font-size="900" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-style="italic">Software Guidelines</tspan></text><text y="9320.6" xml:space="preserve"><tspan x="46339 46965 47480 47939 48204 48552 49067 49360 49653 50168 50905 51198 51713 52228 52493 53008 53523 53816 54331 54624 55028 55293 55697 56212 56727 57242 57535 58050 58315 58830 59289 59554 59902 60417 60710 61003 61518 62255 62714 63229 63494 63759" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">The following points should be followed...</tspan></text><text y="10870.6" xml:space="preserve"><tspan x="46339 46644 46949" font-size="500" font-family="'Courier New', 'Liberation Mono', monospace">●  </tspan><tspan x="47254 47602 48117 48521 48814 49273 49566 50025 50540 50833 51292 51557 52072 52587 52852 53311 53576 54091 54550 54898 55413 55928 56221 56625" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Instalable on a harddisk</tspan></text><text y="12420.6" xml:space="preserve"><tspan x="46339 46644 46949" font-size="500" font-family="'Courier New', 'Liberation Mono', monospace">●  </tspan><tspan x="47254 47825 48340 48855 49370 49663 50178 50443 50958 51417 51682 52141 52656 52949 53408 53673 53966 54481 54746 55261 55720 55985 56278 56737 57252 57767 58226 58741 59200 59715 59980 60328 60676 61191 61984 62249 62708 63223 63738 64003 64518 64811 65326 65785 66300 66565 66913 67372 67776 68291 68584 69099 69392 69685 70200" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Should be able to be launched from any video resolution</tspan></text><text y="13970.6" xml:space="preserve"><tspan x="46339 46644 46949" font-size="500" font-family="'Courier New', 'Liberation Mono', monospace">●  </tspan><tspan x="47254 47880 48395 48854 49119 49634 50038 50497 50845 51110 51514 52029 52544 53059 53352 53867 54132 54647 55106 55371 55886 56234 56693 57097 57556 58071 58364 58823 59338 59603 60340 60633 60926 61441 61706 62165 62430 62834 63127 63642 64157 64450 64909 65174 65633 66148 66607 67066 67581 67874 68333 68848 69141 69600 69865 70213 70506 70799 71258 71551 71816 72109 72568 73027 73542" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">The user should be presented with a single executable file; leave</tspan></text><text y="15220.6" xml:space="preserve"><tspan x="46339 46798 47313 47772 48065 48358 48651 49110 49458 49973 50238 50753 51212 51505 51964 52229 52577 52870 53163 53622 54026 54291 54556 55071 55364 55879 56394 56659 57063 57522 58037 58385 58844 59109 59457 59750 60043 60502 60906 61171 61436 61895 62188 62647 62912 63177 63470 63985 64389 64682 65197 65656 65921 66380 66645 67104 67619 68412 68927 69386 69901 70194 70709" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">ancillary data files, high score files, etc. inside a companion</tspan></text><text y="16470.6" xml:space="preserve"><tspan x="46339 46687 47202 47495 48010 48469 48817" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">folder.</tspan></text><text y="18020.6" xml:space="preserve"><tspan x="46339 46644 46949" font-size="500" font-family="'Courier New', 'Liberation Mono', monospace">●  </tspan><tspan x="47254 47991 48284 48577 49092 49829 50094 50387 50902 51361 51626 52141 52545 53004 53352 53617 53910 54425 54690 55149 55664 55957 56250 56515 56974 57489 58004 58269 58617 59076 59369 59884 60232 60747 61012 61305 61820 62085 62378 62893 63352 63617 64132 64591 64995 65510 65803 66318 66833 67098 67557 68072 68531 68990 69283 69576 70091 70356 71093 71608 72067 72415" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Allow the user to exit and return to the desktop exactly where</tspan></text><text y="19270.6" xml:space="preserve"><tspan x="46339 46798 47313 47828 48093 48608 49123 49860 50125 50529 50822 51337 51796 52061 52354 52813 53161 53454 53719 54234 54582 54930" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">and how s/he left off.</tspan></text><text y="20820.6" xml:space="preserve"><tspan x="46339 46644 46949" font-size="500" font-family="'Courier New', 'Liberation Mono', monospace">●  </tspan><tspan x="47254 47991 48395 48854 49119 49412 49927 50386 50651 51222 51681 51974 52433 52948 53463 53728 54187 54702 55217 55676 56191 56650 57109 57624 57889 58182 58697 59212 59616 59909 60202 60661 61176 61441 61789 62304 62652 62917 63376 63669 63962 64227 64520 65035 65550 65954 66247 66540 66999 67514 67862 68377 68725 69018 69477 69992 70285 70744" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Use the Falcon enhanced joystick for all joystick-oriented</tspan></text><text y="22070.6" xml:space="preserve"><tspan x="46339 46854 47313 48106 48565 48969 49262 49527 50209 50946 51294 51809 52324 52589 52993 53286 53801 54094 54553 54818 55277 55792 56307 56600 56948 57463 57756 58160 58425 58829 59344 59859 60374 60667 61182 61447 61962 62477 62770 63035 63550 64009 64274 64678 65193 65708 66223 66738 67086 67379 67838 68353" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">games; CX-40 style controls should not be supported.</tspan></text><text y="23620.6" xml:space="preserve"><tspan x="46339 46644 46949" font-size="500" font-family="'Courier New', 'Liberation Mono', monospace">●  </tspan><tspan x="47254 47602 48117 48576 49035 49328 49621 50136 50401 50666 51403 51918 52377 52725 53184 53449 53964 54479 54883 55287 55580 56095 56388 56847 57112 57377 57836 58129 58422 58937 59674 59939 60232 60747 61206 61471 61986 62445 63238 63697 63962 64255 64770 65035 65550 66009 66274 66622 67137 67652 67917 68210 68725 68990 69449 69714 70451 70744 71259 71774 72289 73026" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Ideally, where possible, allow the game to be run in a window;</tspan></text><text y="24870.6" xml:space="preserve"><tspan x="46339 46632 47147 47440 47844 48109 48402 48806 49071 49808 50267 50560 50853 51201 51605 52120 52413 52706 53165 53680 53945 54293 54808 55156 55421 55936 56340 56799 57147 57551 57816 58109 58624 59083 59376 59641 60378 60837 61352 61645 61910 62203 62718 62983 63498 63791 64250 64765 65030 65545 66004 66797 67256 67660 67925 68218 68733 68998 69291 69806" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">this is well-suited for users that want to play games in the</tspan></text><text y="26120.6" xml:space="preserve"><tspan x="46339 47243 47758 48051 48344 48637 49263 50000 50571 50836 51629 52144 52437 52730 53023 53371 53664 54123 54527 55042 55335 55850 56365 56630 57089 57604 58119 58412 58760 59275 59790 60583 61042 61557 61850 62115 62463 62867 63382 63841 64356 64621 65080 65484 65749 66486 67001 67294 67587 68046 68311 68826 69341 70078 70593 70886 71401 71860 72375 72668 73183" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">MultiTOS multi-tasking environment (such as while downloading</tspan></text><text y="27370.6" xml:space="preserve"><tspan x="46339 46798 47063 47411 47704 47997 48456 48804" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">a file).</tspan></text><text y="28920.6" xml:space="preserve"><tspan x="46339 46644 46949" font-size="500" font-family="'Courier New', 'Liberation Mono', monospace">●  </tspan><tspan x="47254 48213 48672 48937 49396 49911 50426 50885 51344 51637 51902 52695 53210 53614 53907 54172 54687 55091 55550 55898 56302 56567 56860 57375 57640 57988 58503 59018 59283 59576 60091 60356 60871 61386 61901 62416 62931 63446 63961 64476 64991 65506 66021 66286 66745 67260 67553 68068 68416 68681 69474 69989 70504 70963 71256 71521 72036 72551" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">We expect most users to run in 640x480x256 color mode; you</tspan></text><text y="30170.6" xml:space="preserve"><tspan x="46339 47132 47591 48106 48371 49108 49567 50082 50375 50640 50933 51448 51713 52228 52687 53146 53661 53926 54219 54734 55027 55431 55696 55989 56504 56769 57562 57855 58370 58885" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">may want to keep this in mind.</tspan></text><text y="31720.6" xml:space="preserve"><tspan x="46339 46644 46949" font-size="500" font-family="'Courier New', 'Liberation Mono', monospace">●  </tspan><tspan x="47254 47602 47950 48215 48730 49245 49760 50025 50540 50944 51403 51668 51961 52476 52935 53200 53937 54230 54801 55066 55525 55984 56277 56570 56835 57100 57615 57963 58478 58771 59119 59634 60149 60497 61290 61638 61986 62251 62599 62892 63240 63699 64214 64618 64966 65481 65829 66622 66887 67235 67750 68098 68891 69239 69504 69769 70284 70799 71314 71579 72038 72497" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">If you use the O/S call, vr_trn_fm() (transform form), you can</tspan></text><text y="32970.6" xml:space="preserve"><tspan x="46339 46798 47257 47661 47954 48247 48762 49027 49486 50001 50516 51031 51490 51838 52131 52396 52911 53204 53719 54178 54693 54958 55473 55932 56225 56684 56949 57297 57645 58160 58953 59218 59622 59915 60374 60889 61404 61863 62211 62726 62991 63339 63854 64202 64995 65260 65553 66068 66333 66626 67141 67600 67865 68324 68839 69187 69535 69994 70453 70746 71011 71359 71874 72222" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">easily convert video data from standard form to the correct form</tspan></text><text y="34220.6" xml:space="preserve"><tspan x="46339 46687 47202 47550 47815 48108 48623 49082 49347 49806 50321 50669 51017 51476 51991 52284 52549 52897 53356 53760 54275 54568 55083 55376 55669 56184 56699" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">for the current resolution.</tspan></text></g>

<g><rect x="4931" y="5383" width="27878" height="50372" fill="#fff" stroke="none"/><text y="6392.6" xml:space="preserve"><tspan x="4931 5497 5951 6294 6582 7092 7602 8056 8399 8853 9141 9540 9800 10199 10709 11219 11729 12017 12527 12787 13297 13807 14095 14383 14643 15542 16108 16674 17184 17527 18259 18880 19140 19428 19938 20670 20930 21273 22005 22293 22581 23091 23351 23805 24315 24575 25085 25595 26049 26559 26819 27273 27783 28071 28359 28813 29267 29555 30065" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Peripherals should pull MFP_INT low (with an open collector</tspan></text><text y="7642.6" xml:space="preserve"><tspan x="4931 5441 5951 6239 6749 7259 7547 7890 8150 8882 9392 9680 9968 10422 10682 11192 11702 11990 12500 12788 13298 13808 14068 14967 15533 16099 16609 16952 17573 17916 18176 18686 18974 19484 19994 20254 20542 21052 21312 21822 22332 22620 23130 23390 23900 24243 24586 24846 25134 25644 26098 26358 27257 27823 28389 28649 28992 29335 29845" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">output) while holding MFP_IEI high to hold off the MFP from</tspan></text><text y="8892.6" xml:space="preserve"><tspan x="4931 5385 5784 6183 6637 6980 7268 7556 8066 8576 8836 9124 9412 9811 10071 10581 11313 11823 12083 12371 12881 13169 13623 13966 14309 14819 15329 15617 15877 16387 16841 17295 17583 18093 18436 18696 18956 19216 20170 20680 21134 21644 21904 22247 22979 23656 24388 24648 25158 25668 26122 26521 26781 27069 27579 28311 28571 28859 29369 29879 30333 30621 31131 31585" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">asserting its own interrupt vector.  When IACK goes low together</tspan></text><text y="10142.6" xml:space="preserve"><tspan x="4931 5663 5951 6239 6749 7009 7630 8362 8928 9188 9448 9736 10246 10700 10960 11470 11924 12267 12555 13065 13575 14029 14372 14826 15114 15374 15773 16283 16793 17303 17591 18101 18361 18871 19381 19669 19929 20383 20643 21153 21607 22061 22349 22859 23202 23462 23972 24482 24770 25280 25540 25828 26338 26792 27052 27562 28016 28304 28758 29018 29528 30038 30437" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">with LDS, the peripheral should put a vector onto the data bus.</tspan></text><text y="12642.6" xml:space="preserve"><tspan x="4931 5552 6062 6516 6776 7119 7685 8306 8649 9159 9447 9957 10300 10560 10959 11247 11757 12267 12721 13009 13408 13668 14456 14966 15365 15653 15913 16423 16933 17221 17481 17991 18445 18705 19215 19558 19846 20356 20810 21320 21580 22090 22600 22860 23370 23824 24167 24455 24965 25475 25929 26272 26726 27014 27413 27673 28072 28360 28870 29324 29778 30038 30326 30836 31290" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">The IPL(2:0) signals must not be driven by peripherals since they</tspan></text><text y="13892.6" xml:space="preserve"><tspan x="4931 5385 5728 6182 6442 6730 7240 7528 7982 8325 8835 9289 9577 9865 10375 10635 11145 11488 11776 12286 12740 13250 13510 14020 14530 14790 15244 15754 16153 16441 16951 17739 17999 18287 18797 19307 19595 20049 20309 20569 20829 21450 21960 22414 22924 23184 23638 23981 24435 24695 25205 25715 26003 26513 26773 27061 27571 28025 28313 28823 29333 29787 30297 30557 30900 31410" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">are internally driven by custom logic.  They are only included for</tspan></text><text y="15142.6" xml:space="preserve"><tspan x="4931 5441 5895 6405 6693 7147 7601 8000 8260 8992 9502 9790 10244 10754 11014 11802 12256 12766 13026 13758 14212 14722 15010 15270 15558 16068 16328 17116 17626 18136 18424 18712 19222 19565 19825 20113 20623 21077 21476 21930 22190 22589 22877 23387 23897 24351 24639 25038" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">devices which may want to monitor these signals.</tspan></text><text y="17683" xml:space="preserve"><tspan x="4931 5712.4 6044.5 6633 7156.8 7745.3 8045 8698.2 9030.3 9618.8 10207.3 10731.1 11063.2" font-size="1100" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-weight="bold" text-decoration="underline">Clock Signals</tspan></text><text y="19242.6" xml:space="preserve"><tspan x="4931 5608 6174 6906 7583 8204 9731 10297 10751 11039 11299 11587 12097 12357 12867 13766 14498 14952 15212 15666 15954 16214 16557 17011 17410 17864 18152 18412 18672 18960 19470 19924 20434 20694 21093 21547 21835 22095 22383 22893 23153 23663 24173 25072 25804 26258 26518 27028" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">CPUCLKSet to 8MHz at reset, then set to 16MHz by</tspan></text><text y="20492.6" xml:space="preserve"><tspan x="7331 7952 8684 9250 9510 9770 10030 10651 11161 11449 11848 12108 12562 12850 13360 13814 14324 14584 14872 15271 15531 16041 16440 16894 17404 17664 18174 18684 18944 19232 19742 20196 20456 20855 21365 21764 22052 22506 23294 23554 24064 24574" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">TOS.  This clock is used by the system bus</tspan></text><text y="21742.6" xml:space="preserve"><tspan x="7331 7619 8129 8389 8788 9298 9808 10262 10772 11115 11625 12135 12423 12877 13331 13591 14045 14333 14621 14881 15391 15901 16300 16560 17014 17524 17978 18266 18720" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">to synchronize all bus cycles</tspan></text><text y="22992.6" xml:space="preserve"><tspan x="4931 5441 5951 6461 7193 7925 9731 10241 10751 11261 11993 12725 13179 13439 13782 14070 14580 15034 15544 15804 16258 16546 17056 17510" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">500KHZ500KHz fixed clock</tspan></text><text y="25492.6" xml:space="preserve"><tspan x="4931 5663 6117 6405 6693 7203 7657 8000 8260 8770 9113 9373 9661 10171 10625 11024 11478 11738 12192 12480 12990 13444 13954 14353 14613 15012 15522 16032 16542 16830 17340 17600 18110 18564 18824 19112 19622 20076 20586 21040 21550 21810 22542 22830 23118 23628 23888 24676 25186 25529 25983 26243 26531 27041 27495 28005 28265 28775 29285 29739 29999 30620 31241" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Neither of these clocks should be loaded with more than one TTL</tspan></text><text y="26742.6" xml:space="preserve"><tspan x="4931 5219 5729 6239 6693 6953 7463 7917 8427 8715 9169 9623 9883 10226 10736 11079 11339 11793 12303 12813 13101 13611 14065 14353 14807 15317 15605 15948 16208 16718 17228 17738 18192 18535 18795 19249 19759 20269 20529 20983 21271 21614 22068 22578 23366 23765 24053 24507 25017 25471 25925 26324 26584 26844 27104 27725 28235 28689 29143 29542 29941 30229 30739" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">type device (or equivalent) under any circumstances.  Excessive</tspan></text><text y="27992.6" xml:space="preserve"><tspan x="4931 5219 5729 6183 6693 6981 7491 8001 8261 8771 9114 9374 9662 10172 10626 11025 11479 11739 12193 12481 12991 13445 13955 14354 14614 14957 15467 15810 16070 16524 17034 17544 17804 18314 18602 19112 19566 19909 20169 20568 20856 21366 21876 22330 22618 23017 23277 23787 24297 24557 24845 25355 25809 26069 26523 27033 27543 27997 28507 28906 29194 29704 30214 30474 30984 31494 31893" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">loading of these clocks (or any other signals on the expansion bus)</tspan></text><text y="29242.6" xml:space="preserve"><tspan x="4931 5663 5951 6239 6527 6787 7075 7529 7983 8493 8753 9041 9551 9811 10210 10720 11119 11407 11861 12649 12909 13419 13929 14272 14726 15014 15302 15756 16266 16554 16842 17130 17418 17928 18188 18698 19041 19301 19644 20098 20386 20674 21184 21527 21981" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">will lead to system unreliability or failure.</tspan></text></g>
</svg>

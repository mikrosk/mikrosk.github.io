<g><rect x="4931" y="5383" width="27878" height="50372" fill="#fff" stroke="none"/><text y="6392.6" xml:space="preserve"><tspan x="7163 7673 8127 8637 9036 9296 9584 10094 10354 10864 11263 11717 11977 12320 12830 13173 13433 13943 14286 14740 15472 15760 16270 16780 17040 17300 17560 18181 18691 19145 19544 19998 20258 20768 21222 21732 22131 22391 22845 23299 23587 23847 24135 24645 25044 25332 25592 25880 26168 26678 27132 27392 27680 28190 28644 28904 29414 29924 30434 30833 31121 31575 32029" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">pens to use for drawing.  These pens act just like the physical</tspan></text><text y="7642.6" xml:space="preserve"><tspan x="7163 7673 8127 8637 9036 9296 9584 10094 10354 10642 11152 11606 11866 12376 12664 13174 13628 13971 14231 15019 15529 16039 16493 16892 17152 17606 18116 18570 19024 19534 19822 20082 20370 20880 21334 21622 21882 22392 22902 23356 23810 24070 24524 24784 25294 25582 26092 26546 26834 27094 27382 27781 28041 28551 28894 29348 30080 30590 30850 31110 31398" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">pens in the other modes except that once a pixel is drawn, it</tspan></text><text y="8892.6" xml:space="preserve"><tspan x="7163 7617 8071 8581 9091 9601 9889 10149 10659 11113 11373 11827 12337 12791 13301 13811 14265 14775 15035 15545 15944 16232 16742 17252 17512 18022 18421 18931 19385 19895 20183 20693 21036 21379 21722" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">cannot be changed using vs_color().</tspan></text><text y="11392.6" xml:space="preserve"><tspan x="4931 5552 6062 6516 6776 7175 7685 8195 8705 9215 9475 9874 10384 10783 11071 11525 12313 12573 12861 13260 13520 13974 14262 14550 15060 15792 16191 16451 16905 17415 17925 18213 18667 18955 19465 19864 20124 20634 21088 21487 21747 22035 22545 22999 23259 23602 24112 24400 24688 25198 25930 26218 26728 27238 27498 27952 28462 29250 29760 30270 30780 31234 31744 32032 32431" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">The sound system is allows contains has the following components:</tspan></text><text y="12942.6" xml:space="preserve"><tspan x="4931 5191 5451 5711 6221 6564 6824 7084 7594 8104 8614 9124 9634 9894 10626 10914 11424 11712 12000 12454 12742 13002 13568 13856 14366 14876 15330 15618 15878 16444 16787 17297 17751 18205 18604 19003 19513" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">   1)  56001 Digital Signal Processor</tspan></text><text y="14192.6" xml:space="preserve"><tspan x="4931 5191 5451 5711 6221 6564 6824 7084 7816 8715 9447 9707 10106 10616 11126 11636 12146 12406 12860 13370 13880 14168 14678 15132 15392 15680 16190 16644 16932 17192 17646 18100 18610 18870 19380 19668 20122 20632 21142 21596 22050 22560 22820 23330 23673 23933 24276 24730 25184 25694 26037 26547 26807 27317 27827 28281 28541 28801 29089 29821 30331" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">   2)  DMA sound engine that can playback or record one, two,</tspan></text><text y="15442.6" xml:space="preserve"><tspan x="4931 5219 5729 6072 6526 6980 7240 7750 8093 8353 8696 9206 9716 10059 10319 10829 11339 11599 12109 12397 12685 12945 13344 13632 14086 14429 14883 15393 15653 16107 16617 17071 17581 18091 18545 18833 19232 19492 19946 20234 20494 21004 21514 21774 22284 22544 23054 23564 23824 24334 24677 24937 25447 25957 26217 26727 27459 27913" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">three or four 16 bit stereo channels at 12.5,25 or 50 kHz.</tspan></text><text y="16692.6" xml:space="preserve"><tspan x="4931 5191 5451 5711 6221 6564 6824 7084 7594 8104 8364 8874 9162 9450 9710 10109 10397 10851 11194 11648 12158 12418 12872 13382 13892 14346 14800 15060 15514 15802 16090 16600 17332 17620 18130 18640 18900 19410 19920 20208 20718 20978 21266 21776 22286 22796 23084 23344 23798 24308 24818 25078 25588 26098 26386 26896 27406 27694 27954 28464 28807 29067 29466 29976 30486 30996" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">   3)  16 bit stereo codec allowing both input and output of sound</tspan></text><text y="17942.6" xml:space="preserve"><tspan x="4931 5441 5729 7331 7841 8351 8639 8927 9215 9558 9846 10356 10616 11126 11580 12034 12544 13054 13564 14074 14584 15038 15298 15752 16262 16772 17032 17820 18108 18562 18905 19415 19925 20435 20945 21455 21909 22169 22457 22911 23365 23875 24274" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">viabuilt-in headphone and microphone jacks.</tspan></text><text y="19192.6" xml:space="preserve"><tspan x="4931 5191 5451 5711 6221 6564 6824 7084 7816 8326 8586 9040 9550 9838 10292 10635 11145 11599 11887 12147 12657 13167 13510 13798 14058 14401 14661 15393 15959 16525 16868 17128 17416 17926 18380 18668 18928 19382 19670 19958 20468 21200 21599 21859 22313 22823 23111 23565 23908 24418 24872 25160 25420 25763 26051 26783 27043 27386 27896 28239 28499 28953 29213 29945 30233 30743" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">   4)  An external port ( DSP) that allows external I/O for a wide</tspan></text><text y="20442.6" xml:space="preserve"><tspan x="4931 5441 5895 6238 6526 6980 7268 7778 8038 8548 8891 9151 9661 10171 10514 11024 11534 11933 12387 12786 13046 13306 13566 14187 14697 15151 15411 15921 16375 16663 17117 17405 17693 18092 18352 18862 19205 19465 19975 20485 21217 21477 21765 22275 22729 23128 23582 23842 24352 24806 25149 25437 25947 26457 26856 27116 27570 28080 28868 29378 29888 30398 30852 31362 31650" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">variety of purposes.  The details of how these various components</tspan></text><text y="21692.6" xml:space="preserve"><tspan x="4931 5385 5839 6349 6609 7119 7573 7833 8343 8742 9196 9706 9966 10420 10930 11440 11700 11988 12498 12758 13490 14000 14454 14742 15002 15456 15966 16754 17264 17552 18062 18516 18804 19092 19602 20112 20511 20771 21503 21791 22079 22367 22627 23137 23591 23851 24361 24649 25159 25613 26123 26383 26671 27181 27441 27784 28294 28582 29092 29435" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">can be used and in what combinations will be given in future</tspan></text><text y="22942.6" xml:space="preserve"><tspan x="4931 5441 5951 6405 6915 7703 8157 8667 8955 9354" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">documents.</tspan></text></g>

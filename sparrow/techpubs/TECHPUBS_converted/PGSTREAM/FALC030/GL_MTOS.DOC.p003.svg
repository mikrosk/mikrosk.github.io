<line x1="75565" y1="57404" x2="44996" y2="57404" fill="none" stroke="#000" stroke-width="100" stroke-linecap="butt" stroke-linejoin="round"/>
<g><rect x="46339" y="5383" width="27878" height="50372" fill="#fff" stroke="none"/><text y="6392.6" xml:space="preserve"><tspan x="46339 46627 47137 47397 47685 48195 48649 48909 49197 49651 49994 50282 50542 51052 51395 51655 51943 52453 52907 53167 53585 54262 54716 55226 55680 56134 56422 56840 57100 57610 58120 58408 58696 59206 59716 59976 60236 60654 61331 61785 62295 62749 63203 63491 63909 64169 64568 65078 65588 66098 66386 66896 67156 67610 67898 68630 69084 69594 69993 70253 70763" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">to the left of the "Cancel" button. "Cancel" should always be</tspan></text><text y="7642.6" xml:space="preserve"><tspan x="46339 46793 47247 47757 48045 48333 48787 49075 49363 49817 50271 50781 51041 51301 51755 52265 52775 53035 53453 54185 54917 55335 55595 55883 56282 56542 57052 57562 58072 58526 58869 59323 59777 60176 60630" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">capitalized, and "OK" is uppercase.</tspan></text><text y="10142.6" xml:space="preserve"><tspan x="48139 48871 49381 49669 50123 50383 50726 51069 51329 52006 52516 52804 53092 53602 54112 54511 54771 55059 55569 55829 56339 56793 57303 57757 58100 58554 58842 59102 59501 60011 60521 61031 61319 61829 62089 62599 63053 63313 63767 64221 64731 65019 65307 65761 66049 66337 66791 67245 67755 68015 68747 69257 69600 70110 70509 70769 71029 71539 72049" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Note -- Buttons in general should be capitalized words, not</tspan></text><text y="11392.6" xml:space="preserve"><tspan x="48139 48593 48881 49169 49429 49939 50449 50959 51413 51756 52210 52664 53063 53517" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">all uppercase.</tspan></text><text y="13933" xml:space="preserve"><tspan x="46339 47022.1 47583.1 48144.1 48460.9 49021.9 49582.9 50143.9 50429.9 51479.3 51796.1 52357.1 52918.1 53479.1 54284.3" font-size="1100" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-style="italic">Toolbox Windows</tspan></text><text y="15492.6" xml:space="preserve"><tspan x="46339 46960 47470 47980 48268 48778 49288 49798 50058 51012 51300 51810 52320 52830 53562 53961 54221 54675 55018 55472 55732 56186 56446 56845 57355 57809 58263 58551 59005 59293 59553 60007 60295 60749 61148 61547 61807 62317 62660 62920 63652 63940 64450 64960 65470 66202 66462 66750 67260 67714 68002 68262 68716 69059 69513 69773 70283 70682 71136 71646 71906 72249 72759" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Toolbox Windows are a special class of window that are used for</tspan></text><text y="16742.6" xml:space="preserve"><tspan x="46339 46849 47192 47702 48212 48500 49010 49298 49808 50318 50578 50866 51376 51830 52090 52600 52999 53453 53796 54056 54788 55076 55364 55874 56134 56644 57154 57664 58007 58795 59305 59815 60269 60557 60817 61271 61781 62291 62579 62922 63432 63720 63980 64490 64833 65093 65381 65891 66234 66744 67087 67875 68329 68617 68905 69415 69925 70185 70445 71066 71576" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">providing the user with non-modal control or information. The</tspan></text><text y="17992.6" xml:space="preserve"><tspan x="46339 47127 47637 48036 48324 48584 49038 49548 50336 51124 51634 52144 52404 52914 53313 53767 54027 54759 55269 55779 56067 56577 56837 57347 57801 58061 58404 58914 59257 59517 60027 60370 60824 61556 61844 62354 62864 63124 63412 63922 64432 64720 64980 65379 65833 66121 66575 67029 67317 67605 68115 68625 68885 69173 69683 69943 70397 70657 71167 71621 71909 72419" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">most common use would be for drawing tool selection in a paint</tspan></text><text y="19242.6" xml:space="preserve"><tspan x="46339 46849 47192 47702 48212 48555 49009 49797 50057 50317 50827 51170 51430 51884 52394 52682 53192 53535 53795 54194 54648 54936 55390 55844 56132 56420 56930 57440 57700 57960 58581 59091 59545 59805 60093 60603 61113 61401 61800 62060 62514 62857 63311 63571 64081 64480 64990 65444 65732 66020 66530 66790 67189 67699 68209 68941 69451 69711 70165 70564 70824 71112 71622 72132 72420 72874 73328" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">program, or color selection. The tools are usually shown as logical</tspan></text><text y="20492.6" xml:space="preserve"><tspan x="46339 46849 47192 47702 48212 48722 49121 49381 49891 50234 50494 50782 51236 51746 52256 52655 52915 53203 53713 54167 54455 54715 55003 55513 55967 56227 56737 57136 57590 57933 58193 58647 59101 59611 59871 60325 60779 61178 61466 61754 62264 62524 62978 63377 63776 64286 64740 65028 65482 65770 66224 66484 67216 67504 67792 68302 68562 68850 69360 69814 70102" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">groups of icons that the user can easily associate with their</tspan></text><text y="21742.6" xml:space="preserve"><tspan x="46339 46682 47192 47702 48156 48444 48732 49242 49752 50151 50411 50671 50931 51663 52173 52683 52971 53481 53935 54278 54538 55048 55447 55901 56161 56671 57014 57274 57562 58072 58360 58759 59019 59307 59817 60327 60781 61041 61551 61894 62154 62886 63174 63684 64194 64704 65436 65696 65984 66383 66643 67097 67607 68117 68405 68693 69203 69713 70167 70455 70715 71114 71402 71856 72144 72654" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">functions.  Another use of this type of window is continual status</tspan></text><text y="22992.6" xml:space="preserve"><tspan x="46339 46849 47359 47647 48157 48667 48955 49215 49475 49874 50384 50838 51348 51608 52062 52461 52721 53009 53519 53973 54233 54743 55086 55596 56106 56449 56903 57302 57701 57961 58471 58814 59074 59528 59788 60131 60419 60707 61161 61421 61931 62441 63173 63683 63971 64481 64935 65445 65705 66215 66558 66818 67161 67615 68069 68523 68811 69265 69775 70063 70517 70805 71093 71603" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">output, such as the progress of a file download or recalculation</tspan></text><text y="24242.6" xml:space="preserve"><tspan x="46339 46627 46915 47703 48157" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">time.</tspan></text><text y="26783" xml:space="preserve"><tspan x="46339 47144.2 47461 48022 48521.4 48898.7 49184.7 49989.9 50489.3 51050.3 51549.7 51927 52426.4 52743.2 53029.2 53834.4 54395.4 54712.2 55211.6" font-size="1100" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-style="italic">Other General Notes</tspan></text><text y="28342.6" xml:space="preserve"><tspan x="46339 47071 47581 48091 48379 48667 49121 49575 49863 50151 50661 51171 51570 51830 52229 52739 53249 53759 54047 54557 54817 55605 56059 56569 57023 57283 57793 58303 58563 59017 59416 59815 60325 61113 61623 61911 62199 62709 63219 63618 63878 64388 64898 65158 65890 66400 66854 67142 67402 67690 68200 68710 69164 69424 69934 70277 70537 70936 71446 71845 72133 72587" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Applications should make no assumptions on what type of system</tspan></text><text y="29592.6" xml:space="preserve"><tspan x="46339 46627 47137 47591 47851 48361 48760 49214 49557 49817 50549 50837 51125 51413 51673 52183 52637 53147 53601 53861 54121 54798 55252 55512 55966 56476 56764 57218 57478 57766 58276 58536 59046 59500 59954 60242 60502 61234 61522 61810 62320 62580 63034 63544 64054 64314 64713 65167 65510 65964 66418 66928 67188 67587 67875 68329 68783 69043 69497 70007 70517 70777 71231 71741 72029 72539" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">the user will have. Be able to deal with any screen size and color</tspan></text><text y="30842.6" xml:space="preserve"><tspan x="46339 46682 47136 47535 48045 48333 48843 49131 49419 49929 50439 50699 50959 51691 52090 52544 52804 53092 53602 54056 54316 54826 55336 55790 56133 56587 56875 57163 57673 58183 58443 58842 59352 59751 60039 60493 61281 61541 61995 62449 62737 63025 63424 63684 63972 64482 64742 65252 65706 65994 66448 66791 67579 67867 68377 68831 69091 69379 69889 70343 70603 71002 71456 71799 72253 72707" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">resolution. Use the operating system calls to determine the screen</tspan></text><text y="32092.6" xml:space="preserve"><tspan x="46339 46849 47137 47925 48379 48889 49288 49576 50086 50596 50995 51255 51709 52219 52729 52989 53388 53898 54297 54585 55039 55827 56087 56541 56995 57505 57959 58469 58757 59045 59333 59621 59909 60363 60762 61022 61310 61820 62080 62590 62933 63443 63953 64241 64751 65205 65465 65753 66263 66717 66977 67487 67886 68340 68683 68943 69675 69963 70251 70761 71021 71309 71819" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">dimensions and system capabilities to provide the user with the</tspan></text><text y="33342.6" xml:space="preserve"><tspan x="46339 46682 46970 47424 47934 48388 48787 49075 49335 49789 50299 51087 51597 52107 52395 52683 53193 53703 53963 54417 54927 55437 55891 56234 56522 56976 57486 57940 58394 58654 59164 59674 60073 60472 60760 61270 61558 62012 62272 62532 63264 63663 64117 64460 64859 65119 65629 66083 66593 67047 67307 67817 68160 68670 69402 69912 70172 70460 70970 71230 71684 72194 72704 73158 73612" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">richest computing experience possible. Users have grown to expect</tspan></text><text y="34592.6" xml:space="preserve"><tspan x="46339 46849 47359 47758 48268 48611 49121 49575 49974 50373 50827 51337 51597 52051 52505 52904 53358 53618 54128 54471 54731 55241 55640 56094 56354 56697 57040 57550 58338 58598 59052 59562 60072 60360 60648 61102 61556 61844 62132 62642 63152 63551 63811 64265 64775 65229 65517 65805 66259 66769 67057 67511 67771 68114 68624 68967 69227 69959 70247 70701 71044" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">unsurpassed ease of use from applications available for Atari</tspan></text><text y="35842.6" xml:space="preserve"><tspan x="46339 46793 47303 48091 48601 49111 49399 49853 50196 50595 50855 51115 51458 51801 52061 52571 53081 53591 53851 54361 54815 55325 55779 56039 56493 57003 57513 57773 58283 58793 59247 59646 59934 60222 60732 61242 61641 61901 62244 62698 63208 63662 64005 64515 64803 65313 65823 66083 66593 66992 67446 67789 68049 68337 68847 69135 69589 69932 70275 70729 71183" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">computers. If you have any questions regarding user interface</tspan></text><text y="37092.6" xml:space="preserve"><tspan x="46339 46849 47303 47702 47990 48500 49010 49270 49613 50123 50466 50726 51458 51746 52200 52543 52831 53091 53545 54055 54843 55353 55863 56151 56605 56948 57347 57607 57867 58377 58665 59119 59573 59972 60426 60686 61029 61483 61937 62225 62485 62828 63171 63625 64079 64339 64627 65137 65397 65851 66305 66593 66881 67141 67651 68161 68671 69014 69274 69784 70238 70748 71202 71490 72000 72510 72964" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">design for Atari computers, please feel free to call your developer</tspan></text><text y="38342.6" xml:space="preserve"><tspan x="46339 46738 47248 47758 48268 48778 49121 49409 49669 50012 50466 50976 51319 51773 52172 52626 53136 53424 53878 54166 54454 54964 55418" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">support representative.</tspan></text></g>

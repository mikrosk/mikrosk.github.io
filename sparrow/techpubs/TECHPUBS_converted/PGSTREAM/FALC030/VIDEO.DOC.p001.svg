<g><rect x="46339" y="3811" width="27878" height="51942" fill="#fff" stroke="none"/><text y="5345.6" xml:space="preserve"><tspan x="51734.3 53116.9 53660.3 54623.3 55480.5 56443.5 56934 58316.5 59279.5 60136.7 61099.7 62588.1 63445.3 64408.3 64951.7 65808.9 66352.3 66895.7 67858.7" font-size="1800" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-weight="bold">Video Documentation</tspan></text><text y="9220.6" xml:space="preserve"><tspan x="46339 47293 47747 48007 48350 48804 49258 49768 50556 51344 51798 52308 52818 53078 53366 53876 54330 54618 54878 55332 55620 55908 56168 56567 57021 57364 57818 58272 58782 59042 59552 60062 60350 60860 61370 61658 61918 62428 62882 63142 63652 64162 64672 65126 65386 65896 66184 66638 66898 67186 67696 68150 68410 69142 69763 70662 70922 71654 72386 72729" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">We recommend that all screen output be done via the GEM VDI.</tspan></text><text y="10470.6" xml:space="preserve"><tspan x="46339 46960 47470 47758 48157 48417 48705 49159 49613 50123 50633 50921 51431 51941 52395 52655 53109 53397 53685 54195 54927 55326 55586 56040 56550 56810 57264 57774 58284 58572 58860 59314 59768 60056 60344 60854 61364 61624 61912 62422 62682 62970 63424 63934 64388 64648 65102 65612 66122 66576 67086 67374 67828 68338 68792 69052 69562 69905 70165 70675 70963 71473 71983 72437" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">This technique allows an application to take advantage of higher</tspan></text><text y="11720.6" xml:space="preserve"><tspan x="46339 46682 47136 47535 48045 48333 48843 49131 49419 49929 50439 50838 51098 51552 52062 52572 52832 53342 53685 54139 54593 54881 55335 55678 55938 56392 56902 57190 57700 58043 58303 58563 59017 59471 59981 60435 60945 61233 61521 61809 62097 62385 62839 63238 63498 64008 64351 64611 65121 65575 66307 66567 66966 67420 67763 68217 68671 69181 69441 70229 70739 71249 71703 72102 72362 72872 73326" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">resolutions and greater color  capabilities of new screen modes yet</tspan></text><text y="12970.6" xml:space="preserve"><tspan x="46339 46738 47026 47314 47602 47890 48150 48493 49003 49513 49967 50255 50543 51053 51563 51823 52111 52621 52881 53669 54179 54522 54976 55236 55524 55812 56600 56888 57176 57630 58140 58400 58799 59087 59375 59885 60339 60627 60915 61425 61935 62334 62594 62854 63808 64262 64522 65032 65542 65802 66312 66822 67554 68008 68518 68972 69315 69575 69918 70372 70826 71336 71846 72356 72644 73098" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">still function in more limited situations. We do however recognize</tspan></text><text y="14220.6" xml:space="preserve"><tspan x="46339 46627 47137 47591 47879 48139 48649 48937 49280 49734 50188 50476 50736 51135 51589 51932 52386 52840 53350 53610 54120 54630 54918 55428 55938 56226 56486 56774 57173 57433 57832 58342 59130 59584 59872 60382 60670 61180 61690 61950 62238 62748 63202 63490 63750 64204 64714 65224 65512 65800 66254 66708 66996 67284 67794 68304 68703 68963 69417 69927 70215 70725 71235 71578 71977 72237 72691 73034" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">that direct screen output is something that applications authors are</tspan></text><text y="15470.6" xml:space="preserve"><tspan x="46339 46849 47359 47647 48157 48667 48927 49215 49725 49985 50717 51171 51681 51969 52229 52517 53027 53287 53797 54307 54567 54827 55087 55819 56218 56478 56932 57192 57535 57989 58388 58898 59186 59474 59734 60466 60920 61180 61634 61977 62431 62691 63201 63711 64165 64675 65463 65917 66427 66715 67003 67513 68023 68283 68571 69081 69535 69795 70194 70648 70991 71445 71899" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">going to want to do.  As a result we are documenting the screen</tspan></text><text y="16720.6" xml:space="preserve"><tspan x="46339 47127 47581 48369 48879 49222 49732 49992 50502 50845 51355 51809 52319 52607 53061 53515 53803 54091 54601 55111 55510 55770 56058 56568 56828 57282 57570 57858 58118 58906 59416 59926 60380 60779 61039 61327 61837 62097 62663 63173 63627 63970 64313 64823 65555" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">memory organizations in all modes in Sparrow.</tspan></text><text y="19220.6" xml:space="preserve"><tspan x="46339 46960 47470 47924 48184 48694 48954 49214 49724 49984 50244 50754 51014 51468 51978 52488 52748 53258 53518 54028 54316 54604 54864 55374 55828 56171 56431 56941 57229 57739 58193 58481 58741 59529 60039 60549 61003 61402 61662 62116 62459 62913 63173 63627 63970 64313 64767 65277 65787 66241 66751 67011 67465 67864 68124 68412 68922 69376 69886 70146 70600 70943 71397 71657 71945 72455 72715 73169" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">The 1, 2, 4 and 8 bit per pixel modes are arranged as they are in an</tspan></text><text y="20470.6" xml:space="preserve"><tspan x="46339 46905 47526 47786 48352 48973 49594 49854 50364 50707 50967 51588 52209 52469 52729 52989 53610 54120 54408 54807 55067 55577 55920 56430 56884 57394 57682 58136 58590 58878 59166 59676 60186 60446 60900 61410 61920 62319 62607 63006 63294 63693 63953 64463 64806 65066 65576 66086 66346 66856 67144 67432 67831 68091 68601 68944 69204 69658 70112 70566 71076 71336 71846 72134 72588 73098" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">ST,STE or TT.  This organization consists of 16 bits of each plane</tspan></text><text y="21720.6" xml:space="preserve"><tspan x="46339 46627 47137 47397 47851 48361 48649 49103 49557 50011 50521 50809 51069 51801 52311 52654 53164 53563 53823 54333 54843 55131 55419 55707 55967 56421 56709 56997 57257 57767 58055 58509 59019 59473 59872 60132 60586 60929 61383 61643 62097 62551 63005 63515 64025 64535 64823 65277 65787 66047 66390 66900 67243" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">in adjacent words until all planes are accounted for.</tspan></text><text y="24220.6" xml:space="preserve"><tspan x="46339 46960 47470 47924 48184 48694 49204 49464 49974 50262 50550 50810 51320 51774 52117 52377 52887 53175 53685 54139 54427 54687 55030 55318 55661 56171 56625 56885 57339 57849 58137 58647 58990 59333 59593 60381 60891 61401 61855 62115 62625 62968 63228 63794 64304 64758 65101 65444 65954 66686 66946 67234 67633 67893 68403 68746 69256 69710 70220 70508 70962 71416 71926 72186 72640" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">The 16 bit per pixel (true color) mode of Sparrow is organized as</tspan></text><text y="25470.6" xml:space="preserve"><tspan x="46339 46849 47303 47757 48267 48721 49231 49491 50001 50289 50799 51253 51541 51940 52200 52460 52720 53341 53795 54249 54759 55019 55529 56039 56299 56809 57097 57385 57645 58377 58887 59230 59740 60000 60454 60964 61474 61762 62216 62504 63014 63413 63673 64127 64415 64703 64963 65473 65816 66076 66364 66874 67328 67588 67876 68386 68729 69239 69582 70370 70824 71112 71400 71910 72420 72680 73023 73533" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">packed pixels.  Each 16 bit word contains all of the information for</tspan></text><text y="26720.6" xml:space="preserve"><tspan x="46339 46793 47053 47563 47851 48361 48815 49103" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">a pixel.</tspan></text><text y="29220.6" xml:space="preserve"><tspan x="46339 46905 47193 47703 48157 48611 48871 49159 49669 49957 50356 50616 51404 51914 52424 52878 53138 53426 53825 54085 54539 54799 55087 55430 55940 56394 56654 57108 57618 57906 58416 58759 59019 59807 60317 60827 61281 61541 61829 62339 62793 63136 63590 63850 64138 64537 64797 65307 65817 66077 66587 67041 67329 67783 68071 68359 68813 69073 69361 69871 70131 70585 71095 71605 72115 72569 72912" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Since this mode is a true color mode there is no palette to convert</tspan></text><text y="30470.6" xml:space="preserve"><tspan x="46339 46627 47137 47591 47851 48361 48815 49103 49557 49817 50105 50615 50903 51413 51673 52350 53082 53759 54019 54307 54817 55160 55670 56013 56801 57255 57543 57831 58341 58851 59111 59454 59964 60307 60567 60855 61365 61819 62079 62589 62877 63387 63841 64351 64611 65010 65520 65919 66207 66661 67449 67709 67969 68229 68850 69360" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">the data into RGB information for the video system.  The</tspan></text><text y="31720.6" xml:space="preserve"><tspan x="46339 46627 47137 47480 47990 48333 49121 49575 49863 50151 50661 51171 51431 51719 52118 52378 52832 53342 53796 54306 54816 55270 55780 56040 56328 56838 57098 57552 58006 58460 58970 59230 59740 60028 60538 60992 61280 61540 61994 62393 62653 62996 63506 63794 64082 64592 65324" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">information is encoded in each pixel as follows</tspan></text><text y="32970.6" xml:space="preserve"><tspan x="46339 47016 47693 48370 49047 49724 50456 51188 51920 52652 53384 54116 54793 55470 56147 56824 57501 57761 58021 58281 58902 59412 59866 60126 60414 60868 61322 61721 62009 62269 62668 62956 63466 63976 64264 64607 64895 65349 65803 66313 66601 66861 67593 67853 68363 68651 68939 69199 69487 69886 70146 70600 70888 71287 71797 72057 72567 72966 73420" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">RRRRRGGGGGXBBBBB.  The least significant G bit is also used</tspan></text><text y="34220.6" xml:space="preserve"><tspan x="46339 46793 47192 47452 47906 48416 48676 49186 49696 50150 50493 50781 51235 51745 52005 52515 52803 53091 53351 53694 54204 54658 55057 55345 55855 56365 56819 57107 57561 58071 58331 58785 59184 59444 60176 60519 60779 61039 61299 62253 62707 62967 63366 63876 64386 64896 65350 65749 66037 66297 66585 67095 67549 67837 68097 68385 68895 69183 69582 69842 70352 70640 70928 71188 71920 72652" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">as an overlay bit (designated as X).  We suggest that this bit NOT</tspan></text><text y="35470.6" xml:space="preserve"><tspan x="46339 46849 47303 47563 48073 48472 48926 49436 49696 49984 50494 50754 51264 51607 52061 52571 53081 53369 53823 54083 54593 55047 55335 55789" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">be used in graphic data.</tspan></text><text y="37970.6" xml:space="preserve"><tspan x="46339 47071 47331 47841 48129 48639 49093 49603 49863 50206 50716 51448 52180 52912 53255 53515 53969 54479 54989 55499 55787 56241 56501 56844 57354 57808 58096 58356 58644 59154 59414 59924 60378 60638 61148 61602 61945 62233 62743 63197 63707 63967 64477 64820 65080 65368 66156 66666 66954 67408 68196 68650 69160 69448 69902 70412 70755 71015 71747 72035 72323" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">A video (_VDO) cookie (yet to be defined or implemented) will</tspan></text><text y="39220.6" xml:space="preserve"><tspan x="46339 46793 47081 47369 47879 48611 48871 49381 49891 50179 50633 51143 51403 51691 52201 52655 53165 53453 53741 54084 54372 54826 55280 55568 55856 56366 56876 57136 57424 57934 58388 58676 58936 59446 59956 60466 60726 61180 61523 61977 62237 62747 63257 63517 63971 64231 65019 65473 65927 66437 66725 67235 67689 67949 68237 68747 69201 69489 69749 70148 70658 71168 71678 72188 72531 72819" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">allow quick identification that you are on a machine that supports</tspan></text><text y="40470.6" xml:space="preserve"><tspan x="46339 46627 47137 47591 47851 48361 48649 49159 49613 50123 50383 50671 51181 51635 51923 52183 52693 53203 53713 53973 54316 54770 55280 55790 56078 56421 56875" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">the video that you require.</tspan></text></g>

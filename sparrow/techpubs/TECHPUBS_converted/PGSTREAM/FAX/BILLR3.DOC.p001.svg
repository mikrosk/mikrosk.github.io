<g><rect x="7200" y="7200" width="46800" height="64800" fill="#fff" stroke="none"/><text y="8653.8" xml:space="preserve"><tspan x="22355.8 23720.4 24771.2 25190.8 25610.4 26661.2 27606.2 28131.7 29602.1 30127.5 30652.9 31072.5 32017.5 33068.3 33593.8 35168.1 36219 37793.3" font-size="1800" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-weight="bold" font-style="italic">Dallas Office Memo</tspan></text><text y="13569.2" xml:space="preserve"><tspan x="7200 7933.2 8533.2 12000 12800.4 13134 13467.6 13801.2 14101.2 14901.6 15434.4 16034.4 16634.4 17234.4 17767.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">To:Bill Rehbock</tspan></text><text y="14769.2" xml:space="preserve"><tspan x="7200 7867.2 8266.8 8866.8 9800.4 12000 13066.8 13599.6 13999.2 14332.8 14932.8 15232.8 15900 16432.8 17032.8 17632.8 18232.8 18765.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">From:Marty Pennock</tspan></text><text y="15969.2" xml:space="preserve"><tspan x="7200 7867.2 8467.2 9067.2 9400.8 9933.6 10466.4 10800 12000 12667.2 13200 13800 14332.8 15000 15333.6 15733.2 16266 16798.8 17732.4 18032.4 18632.4 18932.4 19532.4 19832.4 20632.8 21165.6 21499.2 22032 22332 23132.4 23665.2 23998.8 24531.6 25064.4 25531.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Subject:PageStream 2.2 Beta Release</tspan></text><text y="18369.2" xml:space="preserve"><tspan x="7200 8066.4 8599.2 8932.8 9465.6 12000 12466.8 13066.8 13666.8 14199.6 14499.6 15099.6 15399.6 15699.6 16299.6 16899.6 17499.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Date:June 8, 1992</tspan></text><text y="25569.2" xml:space="preserve"><tspan x="7200 7599.6 7899.6 8499.6 9032.4 9632.4 10165.2 10465.2 10932 11265.6 11798.4 12198 12531.6 13064.4 13664.4 13964.4 14564.4 15031.2 15364.8 15964.8 16564.8 16864.8 17532 18064.8 18664.8 19197.6 19864.8 20198.4 20598 21130.8 21663.6 22597.2 22897.2 23497.2 23797.2 24397.2 24697.2 25497.6 26030.4 26364 26896.8 27196.8 27997.2 28530 28863.6 29396.4 29929.2 30396 30928.8 31228.8 31828.8 32128.8 32428.8 33295.2 33628.8 33962.4 34262.4 34862.4 35262 35794.8 36394.8 36728.4 37328.4 37928.4 38395.2 38695.2 39295.2 39694.8 40294.8 40894.8 41228.4 41761.2 42694.8 43161.6 43461.6 43795.2 44395.2 44928 45261.6 45561.6 45961.2 46261.2 47127.6 47660.4 48127.2 48427.2 49027.2 49560 50160 50493.6 51093.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">I have started using PageStream 2.2 Beta Release 5. All previous problems that I was having</tspan></text><text y="26769.2" xml:space="preserve"><tspan x="7200 8066.4 8400 8733.6 9333.6 9633.6 10300.8 10833.6 11433.6 11966.4 12633.6 12967.2 13366.8 13899.6 14432.4 15366 15666 16198.8 16798.8 17398.8 17698.8 18565.2 19298.4 20365.2 20665.2 21064.8 21664.8 22064.4 22998 23530.8 23864.4 24164.4 24564 24897.6 25231.2 25764 26230.8 26530.8 27130.8 27663.6 28130.4 28430.4 29030.4 29563.2 30096 30696 30996 31395.6 31729.2 32329.2 32862 33462 33762 34062 34461.6 34795.2 35095.2 35428.8 35895.6 36195.6 36728.4 37028.4 37628.4 38161.2 38560.8 39160.8 39460.8 40060.8 40660.8 41260.8 41860.8 42160.8 42760.8 43293.6 43826.4 44426.4 44959.2 45559.2 46092 46392 46791.6 47391.6 47791.2 48091.2 48957.6 49490.4 49957.2 50557.2 50857.2 51590.4 52190.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">with PageStream and GEM format files has been fixed. It is a very good package for Desk Top</tspan></text><text y="27969.2" xml:space="preserve"><tspan x="7200 7867.2 8467.2 9067.2 9400.8 9734.4 10201.2 10801.2 11134.8 11734.8 12334.8 12634.8 12934.8 13334.4 13634.4 14234.4 14767.2 15367.2 15900 16200 16732.8 17066.4 17533.2 18133.2 18433.2 19033.2 19500 20032.8 20632.8 20932.8 21799.2 22332 22932 23265.6 23865.6 24265.2 24798 25098 25698 25998 26598 26898 27297.6 27897.6 28297.2 28597.2 29730 30063.6 30663.6 31263.6 31863.6 32730 33196.8 33496.8 34363.2 34963.2 35296.8 35630.4 36163.2 36463.2 37130.4 37663.2 38263.2 38796 39463.2 39796.8 40196.4 40729.2 41262 42195.6 42495.6 43362 43894.8 44361.6 44661.6 45261.6 45794.4 46128 46728 47328 47628 48027.6 48361.2 48961.2 49494 50094 50394 50694 51093.6 51393.6 51926.4 52459.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Publishing. I have also used Ventura 4.0 for Windows while PageStream was being fixed. I can</tspan></text><text y="29169.2" xml:space="preserve"><tspan x="7200 7533.6 7933.2 8533.2 8866.8 9466.8 9866.4 10466.4 10800 11133.6 11733.6 12033.6 12500.4 13033.2 13633.2 13933.2 14266.8 14866.8 15399.6 15733.2 16033.2 16700.4 17233.2 17833.2 18366 19033.2 19366.8 19766.4 20299.2 20832 21765.6 22065.6 22399.2 22866 23166 23698.8 24231.6 24698.4 25032 25564.8 25964.4 26264.4 26797.2 27397.2 27997.2 28297.2 28897.2 29497.2 29830.8 30363.6 30963.6 31496.4 31896 32196 32529.6 33129.6 33429.6 34029.6 34496.4 35029.2 35329.2 35662.8 36262.8 36795.6 37395.6 37695.6 38562 39094.8 39694.8 40028.4 40628.4 41028 41560.8 41860.8 42160.8 42560.4 42860.4 43393.2 43993.2 44326.8 44926.8 45526.8 45826.8 46426.8 46893.6 47227.2 47827.2 48427.2 48727.2 49660.8 50260.8 50560.8 51294 52027.2 52627.2 53227.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">truthfully say that PageStream is easier and quicker to use than Ventura. I enjoy using my TT030</tspan></text><text y="30369.2" xml:space="preserve"><tspan x="7200 7800 8332.8 8732.4 9332.4 9632.4 10566 11166 11698.8 12298.8 12598.8 12898.8 13298.4 13598.4 13932 14532 15132 15732 16032 16632 17232 17764.8 18064.8 18664.8 19264.8 20198.4 20731.2 21031.2 21564 22164 22764 23064 23664 24196.8 24796.8 25329.6 25629.6 26096.4 26430 26962.8 27362.4 27696 28228.8 28828.8 29128.8 29728.8 30195.6 30529.2 31129.2 31729.2 32029.2 32362.8 32696.4 32996.4 33330 33930 34462.8 34862.4 35395.2 35695.2 36228 36561.6 37161.6 37761.6 38361.6 38661.6 39528 39861.6 40195.2 40795.2 41095.2 42028.8 42561.6 43161.6 43761.6 44061.6 44661.6 45061.2 45361.2 45694.8 46294.8 46827.6 47127.6 47727.6 48061.2 48661.2 49194 49593.6 49893.6 50493.6 51026.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">very much. I took one home and have started using it there along with many of the other new</tspan></text><text y="31569.2" xml:space="preserve"><tspan x="7200 7599.6 8132.4 8466 8998.8 9531.6 9998.4 10531.2 10998 11298 11631.6 11965.2 12565.2 13098 13398 14065.2 14732.4 15799.2 16665.6 17532 18398.4 19065.6 19365.6 19898.4 20498.4 21098.4 21398.4 22264.8 23131.2 23997.6 24297.6 24897.6 25197.6 25797.6 26097.6 26397.6 26797.2 27397.2 27697.2 28096.8 28629.6 29162.4 29496 29796 30096 31029.6 31629.6 31929.6 32329.2 33129.6 34196.4 34496.4 34963.2 35296.8 35630.4 36097.2 36397.2 36997.2 37597.2 37930.8 38264.4 38797.2 39097.2 39630 39930 40530 40863.6 41197.2 41497.2 42097.2 42496.8 42796.8 43130.4 43730.4 44263.2 44563.2 44896.8 45230.4 46164 46696.8 46996.8 47296.8 47696.4 47996.4 48330 48930 49396.8 49730.4 50030.4 50364 50964 51564 52164 52764 53364" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">releases like FSMGDOS and HDX 5.0. In fact, my IBM sits quite a bit of the time. I just thought</tspan></text><text y="32769.2" xml:space="preserve"><tspan x="7200 7800 8400 9000 9300 10166.4 10766.4 11366.4 11700 12300 12600 12933.6 13267.2 13867.2 14400 14700 15033.6 15633.6 15933.6 16533.6 17066.4 17599.2 17998.8 18298.8 18632.4 19232.4 19765.2 20098.8 20398.8 21332.4 21932.4 22232.4 22832.4 23232 23832 24432 24765.6 25298.4 26232 26698.8 26998.8 27598.8 28131.6 28731.6 29264.4 29564.4 30164.4 30697.2 31230 31830 32130 32529.6 33062.4 33529.2 34129.2 34462.8 35062.8 35595.6 36195.6 36495.6 36795.6 37195.2 37495.2 38095.2 38628 39228 39760.8 40060.8 40593.6 40927.2 41394 41994 42294 42826.8 43426.8 43959.6 44293.2 44893.2 45360 45892.8 46492.8 46792.8 47325.6 47625.6 48158.4 48758.4 49358.4 49958.4 50292 50824.8 51124.8 51724.8" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">you would like to hear that my problems have been resolved. I have also enclosed a couple of</tspan></text><text y="33969.2" xml:space="preserve"><tspan x="7200 7732.8 8332.8 8865.6 9799.2 10399.2 10732.8 11265.6 11565.6 12165.6 12698.4 13298.4 13831.2 14298 14598 14997.6 15597.6 15997.2 16297.2 16897.2 17497.2 18097.2 18496.8 18796.8 19396.8 19730.4 20263.2 21129.6 21463.2 22063.2 22663.2 22963.2 23563.2 23896.8 24429.6 24962.4 25429.2 26029.2 26428.8 26961.6 27261.6 27561.6 27961.2 28261.2 28794 29326.8 29926.8 30459.6 30859.2 31192.8 31792.8 32092.8 32625.6 33492 34024.8 34358.4 34692 34992 35325.6 35925.6 36458.4 36758.4 37158 37690.8 38024.4 38557.2 38890.8 39224.4 39524.4 39924 40456.8 40790.4 41323.2 41856 42322.8 42855.6 43155.6 43755.6 44155.2 44455.2 45055.2 45588 45987.6 46454.4 46788 47388 47988 48288 48888 49188 49788" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">example pages for your viewing pleasure. I eagerly await the retail release of version 2.2.</tspan></text><text y="36369.2" xml:space="preserve"><tspan x="7200 7867.2 8200.8 8800.8 9333.6 9866.4 10266 10798.8 11132.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Sincerely</tspan></text><text y="39969.2" xml:space="preserve"><tspan x="7200 8266.8 8799.6 9199.2 9532.8 10132.8 10432.8 11100 11632.8 12232.8 12832.8 13432.8 13965.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Marty Pennock</tspan></text></g>

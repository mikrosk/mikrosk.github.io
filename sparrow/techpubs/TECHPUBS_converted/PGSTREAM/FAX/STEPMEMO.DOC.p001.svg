, 'Liberation Serif', serif">Date:November 12, 1991</tspan></text><text y="19269.2" xml:space="preserve"><tspan x="7200 7732.8 8265.6 12000 12399.6 12799.2 13332 13632 14498.4 15098.4 15432 16032 16498.8 16832.4 17365.2 17698.8 18298.8 18598.8 18998.4 19298.4 20164.8 20898" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">cc:Ira Goldstein - ATX</tspan></text><text y="20469.2" xml:space="preserve"><tspan x="12000 12800.4 13134 13666.8 14266.8 14566.8 15433.2 16033.2 16366.8 17300.4 17833.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Rick Holman</tspan></text><text y="21669.2" xml:space="preserve"><tspan x="12000 12466.8 12999.6 13399.2 13798.8 14398.8 14698.8 15366 16299.6 16633.2 16966.8" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Jerry Smith</tspan></text><text y="22869.2" xml:space="preserve"><tspan x="12000 12733.2 13333.2 13933.2 14866.8 15399.6 15999.6 16299.6 16966.8 17366.4 17899.2 18432 19365.6 19898.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Toomey Freeman</tspan></text><text transform="translate(22830 28869.2) scale(1.33 1)" x="0" xml:space="preserve" font-size="900" font-family="'Times New Roman', Times, 'Liberation Serif', serif">E</text><text y="28869.2" xml:space="preserve"><tspan x="7200 8066.4 8599.2 8998.8 9531.6 9831.6 10165.2 10632 10932 11265.6 11865.6 12398.4 12698.4 13098 13698 14298 14898 15498 15798 16398 16797.6 17330.4 17730 18063.6 18363.6 18963.6 19363.2 19663.2 19996.8 20596.8 21129.6 21429.6 22096.8" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Here is the rough draft of the ST</tspan><tspan x="23563.2 24240 24540 25207.2 25740 26139.6 26739.6 27073.2 27606 28138.8 28438.8 29372.4 29905.2 30505.2 31105.2 31638 31971.6 32271.6 32671.2 33271.2 33670.8 33970.8 34370.4 34903.2 35503.2 35836.8 36369.6 37236 37536 38136 38736 39036 39902.4 40635.6 41502 41802 42402 42934.8 43334.4 43801.2 44401.2 45001.2 45601.2 46134 46467.6 46767.6 47067.6 47934 48534 49066.8 49366.8 49899.6 50499.6 51099.6 51699.6 51999.6 52866 53199.6 53533.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">+ Service manual for review by ATX personnel. One copy will</tspan></text><text y="30069.2" xml:space="preserve"><tspan x="7200 7800 8332.8 8632.8 9232.8 9566.4 10033.2 10366.8 10766.4 11100 11700 12300 12633.6 13166.4 13766.4 14066.4 14400 15000 15300 16100.4 16434 16966.8 17566.8 17866.8 18733.2 19333.2 19666.8 20600.4 21133.2 21733.2 22033.2 22333.2 22866 23466 24066 24399.6 24999.6 25532.4 25932 26232 26565.6 27165.6 27465.6 27932.4 28465.2 28864.8 29264.4 29864.4 30164.4 30831.6 31765.2 32098.8 32432.4 33032.4 33332.4 33632.4 34165.2 34765.2 35365.2 35698.8 36298.8 36831.6 37231.2 37531.2 37864.8 38464.8 38764.8 39498 40098 40698 41631.6 42164.4 42764.4 43064.4 43731.6 44131.2 44664 45196.8 46130.4 46663.2 47263.2 47563.2 47863.2 48262.8 48562.8 49429.2 49762.8 50096.4 50430 50730 51330 51862.8 52395.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">be distributed to Rick Holman, another to Jerry Smith, another to Toomey Freeman. I will need</tspan></text><text y="31269.2" xml:space="preserve"><tspan x="7200 7533.6 8133.6 8467.2 8934 9234 9633.6 10166.4 10766.4 11100 11632.8 12499.2 12799.2 13399.2 13999.2 14599.2 15132 15432 16298.4 16632 16965.6 17565.6 17899.2 18499.2 18799.2 19132.8 19999.2 20599.2 20899.2 21765.6 22298.4 22831.2 23431.2 23898 24198 24531.6 25131.6 25431.6 26031.6 26431.2 27031.2 27564 27963.6 28263.6 28597.2 29197.2 29497.2 30097.2 30630 31162.8 31762.8 32062.8 32662.8 33262.8 33562.8 34429.2 34762.8 35096.4 35696.4 35996.4 36330 36930 37462.8 37762.8 38229.6 38762.4 39362.4 39895.2 40495.2 41095.2 41428.8 41961.6 42428.4 42728.4 43328.4 43928.4 44228.4 44562 45162 45495.6 45962.4 46262.4 46862.4 47262 47862 48195.6 48728.4 49261.2 49594.8 49894.8 50194.8 50928 51528 52060.8" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">this review done within two weeks in order to keep up with the schedules on this project. That</tspan></text><text y="32469.2" xml:space="preserve"><tspan x="7200 7666.8 8266.8 8866.8 9466.8 9800.4 10400.4 10700.4 11300.4 11900.4 12234 12534 12867.6 13467.6 14000.4 14300.4 14900.4 15500.4 16033.2 16333.2 16933.2 17466 17799.6 18332.4 18632.4 19165.2 19498.8 19798.8 20331.6 20931.6 21531.6 22131.6 22465.2 22765.2 23631.6 24231.6 24831.6 25364.4 26298 26898 27430.8 27830.4 28130.4 28730.4 29330.4 29630.4 29930.4 30530.4 31130.4 31730.4 32330.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">should put the due date at about November 26, 1991.</tspan></text><text y="40869.2" xml:space="preserve"><tspan x="7200 7867.2 8200.8 8800.8 9333.6 9866.4 10266 10798.8 11132.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Sincerely</tspan></text><text y="48069.2" xml:space="preserve"><tspan x="7200 8266.8 8799.6 9199.2 9532.8 10132.8 10432.8 11100 11632.8 12232.8 12832.8 13432.8 13965.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Marty Pennock</tspan></text></g>

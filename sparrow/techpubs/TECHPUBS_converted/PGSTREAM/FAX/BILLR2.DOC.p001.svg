Liberation Serif', serif">some files created with Postscript graphics, but if I can keep from having to use them and</tspan></text><text y="54369.2" xml:space="preserve"><tspan x="7200 7533.6 8133.6 8666.4 9266.4 9666 10266 10866 11265.6 11798.4 12132 12664.8 12964.8 13497.6 13797.6 14131.2 14731.2 15064.8 15364.8 15964.8 16364.4 16664.4 17530.8 18130.8 18530.4 19130.4 19430.4 19963.2 20362.8 20962.8 21562.8 22162.8 22762.8 23229.6 23529.6 23829.6 24229.2 24529.2 25395.6 25995.6 26595.6 26929.2 27529.2 27829.2 28429.2 28828.8 29361.6 29761.2 30294 30693.6 30993.6 31327.2 31660.8" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">incorporate a lot of work arounds, I would prefer it.</tspan></text><text y="56769.2" xml:space="preserve"><tspan x="7200 7599.6 7899.6 8499.6 9099.6 9699.6 10232.4 10532.4 10866 11466 11998.8 12332.4 12632.4 12966 13566 13899.6 14366.4 14666.4 15532.8 15866.4 16200 16533.6 16833.6 17433.6 17966.4 18300 18900 19200 19800 20266.8 20566.8 20900.4 21500.4 21800.4 22267.2 22867.2 23200.8 23800.8 24333.6 24633.6 25100.4 25700.4 26634 27166.8 27466.8 28066.8 28466.4 28766.4 29100 29700 30232.8 30532.8 31132.8 31532.4 32132.4 32732.4 33066 33598.8 34532.4 34999.2 35299.2 36165.6 36698.4 36998.4 37531.2 37930.8 38463.6 38763.6 39363.6 39896.4 40496.4 40830 41430 42030 42330 42930 43462.8 44062.8 44595.6 44995.2 45528 45861.6 46195.2 46795.2 47395.2 47695.2 48228 48828 49761.6 50361.6 50695.2 51228" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">I hope that this will help us to solve some of the problems we are having generating complex</tspan></text><text y="57969.2" xml:space="preserve"><tspan x="7200 7800 8400 8932.8 9532.8 10466.4 10999.2 11599.2 11932.8 12399.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">documents.</tspan></text><text y="63969.2" xml:space="preserve"><tspan x="46234.8 46902 47235.6 47835.6 48368.4 48901.2 49300.8 49833.6 
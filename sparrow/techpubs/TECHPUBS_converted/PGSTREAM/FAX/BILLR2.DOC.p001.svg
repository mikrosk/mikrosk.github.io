CADD. It seems by far to</tspan></text><text y="45969.2" xml:space="preserve"><tspan x="7200 8066.4 8666.4 9066 9666 9966 10299.6 10899.6 11432.4 11732.4 12332.4 12865.2 13332 13665.6 13965.6 14265.6 14865.6 15465.6 16332 16864.8 17464.8 17997.6 18397.2 18697.2 18997.2 19396.8 19696.8 20229.6 20762.4 21362.4 21762 22095.6 22395.6 22928.4 23528.4 24128.4 24462 24994.8 25328.4 25928.4 26228.4 27094.8 27694.8 28294.8 28594.8 28894.8 29562 30094.8 30494.4 31027.2 31560 32160 32460 33060 33660 34593.6 35193.6 35660.4 35960.4 36560.4 36960 37260 37593.6 38193.6 38527.2 38994 39294 39693.6 40027.2 40360.8 40893.6 41193.6 41726.4 42126 42658.8 43191.6 43525.2 43858.8 44458.8 45058.8 45358.8 45891.6 46291.2 46824 47124 47656.8 47990.4 48457.2 49057.2 49357.2 49690.8 50290.8 50823.6 51157.2 51757.2 52357.2 52890 53490" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">work the best, however, I can't explain why. Screen dumps of this file creation are also included.</tspan></text><text y="48369.2" xml:space="preserve"><tspan x="7200 7969.9 8739.7 9369.7 9999.7 10629.7" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-weight="bold" text-decoration="underline">TT030C</tspan></text><text y="50769.2" xml:space="preserve"><tspan x="7200 7933.2 8533.2 8866.8 9333.6 9633.6 9967.2 10434 10734 11067.6 11667.6 12200.4 12500.4 12834 13434 13767.6 14167.2 14767.2 15067.2 15466.8 15800.4 16134 16666.8 16966.8 17499.6 17899.2 18432 18964.8 19298.4 19831.2 20431.2 20731.2 21597.6 21931.2 22264.8 22864.8 23164.8 23697.6 23997.6 24597.6 25197.6 25797.6 26097.6 26964 27631.2 28030.8 28330.8 28730.4 29797.2 30663.6 30963.6 31563.6 31963.2 32496 33096 33696 34029.6 34562.4 35029.2 35329.2 35629.2 36028.8 36362.4 36662.4 37195.2 37528.8 37995.6 38595.6 38895.6 39495.6 40095.6 40628.4 41095.2 41395.2 41995.2 42595.2 42928.8 43228.8 43828.8 44162.4 44629.2 45229.2 45562.8 46095.6 46695.6 46995.6 47595.6 48128.4 48528 49128 49428
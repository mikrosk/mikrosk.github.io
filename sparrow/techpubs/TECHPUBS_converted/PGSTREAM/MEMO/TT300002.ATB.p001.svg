2 38044.8 38378.4 38727 39460.2 40193.4 40793.4 41393.4 41993.4 42460.2 42808.8 43341.6 43741.2 44274 44622.6 45222.6 45822.6 46156.2 46504.8 47037.6 47437.2 47836.8 48369.6 48902.4 49236 49768.8 50368.8 50717.4 51317.4 51917.4 52266 52599.6 53199.6 53533.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">when trying to run HDX. The fix should be done as needed. All TT030s are not affected by this</tspan></text><text y="29769.2" xml:space="preserve"><tspan x="7200 7800 8199.6 8799.6 9399.6 9733.2 10266 11199.6 11499.6 11805.8 12672.2 12978.4 13312 13844.8 14311.6 14645.2 14951.4 15351 15951 16350.6 16656.8 16990.4 17590.4 18123.2 18429.5 18962.3 19562.3 20162.3 20762.3 21095.9 21429.5 21763.1 22363.1 22963.1 23269.3 23602.9 24069.7 24375.9 24709.5 25309.5 25842.3 26175.9 26775.9 27375.9 27908.7 28508.7 28814.9 29148.5 29748.5 30054.7 30388.3 30988.3 31521.1 31827.3 32693.7 33426.9 34227.3 34527.3 34833.5 35699.9 36033.5 36500.3 37100.3 37406.5 37740.1 38340.1 38872.9 39272.5 39805.3 40111.6 40445.2 40912 41218.2 41751 42351 42883.8 43217.4 43817.4 44284.2 44817 45417 45723.2 46256 46856 47162.2 47762.2 48362.2 48962.2 49495 49828.6 50361.4 50961.4 51267.6 51667.2 52267.2 52867.2 53400" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">problem. A test for the condition is included in the ATB. Also there is enclosed an updated Index</tspan></text><text y="30969.2" xml:space="preserve"><tspan x="7200 7599.6 8199.6 8599.2 8899.2 9499.2 10099.2 10699.2 11098.8 11398.8 12265.2 12998.4 13798.8 14098.8 14698.8 15298.8 15898.8 16498.8" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">for your ATB book.</tspan></text><text y="36969.2" xml:space="preserve"><tspan x="7200 7867.2 8200.8 8800.8 9333.6 9866.4 10266 10798.8 11132.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Sincerely</tspan></text><text y="41769.2" xml:space="preserve"><tspa
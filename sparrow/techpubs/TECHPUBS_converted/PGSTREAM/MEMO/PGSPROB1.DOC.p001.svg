nt-family="'Times New Roman', Times, 'Liberation Serif', serif">ccLeonard Tramiel - SUVL</tspan></text><text y="21969.2" xml:space="preserve"><tspan x="12000 12800.4 13134 13666.8 14266.8 14799.6 15199.2 15799.2 16099.2 17166 17499.6 17833.2 18166.8 18699.6 19099.2 19399.2 19798.8 20098.8 20766 21632.4 22498.8" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Richard Miller - SUVL</tspan></text><text y="23169.2" xml:space="preserve"><tspan x="12000 12399.6 12799.2 13332 13632 14498.4 15098.4 15432 16032 16498.8 16832.4 17365.2 17698.8 18298.8 18598.8 18998.4 19298.4 20164.8 20898" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Ira Goldstein - ATX</tspan></text><text y="24369.2" xml:space="preserve"><tspan x="12000 12733.2 13333.2 14266.8 14566.8 15433.2 15766.8 16299.6 16766.4 17299.2 17832 18432 18732 19131.6 19431.6 20298 21031.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Tom Ulaszek - ATX</tspan></text><text y="27969.2" xml:space="preserve"><tspan x="7200 8066.4 8533.2 8866.8 9466.8 10066.8 10366.8 10700.4 11300.4 11833.2 12133.2 12999.6 13732.8 14799.6 15099.6 15499.2 15832.8 16166.4 16699.2 16999.2 17398.8 17698.8 18231.6 19165.2 19465.2 19932 20464.8 21064.8 21664.8 21998.4 22598.4 23198.4 23498.4 23832 24364.8 24964.8 25497.6 25831.2 26364 26964 27264 27931.2 28598.4 29464.8 30265.2 31065.6 31798.8 32665.2 33465.6 33765.6 34632 35365.2 36432 36732 37065.6 37665.6 38198.4 38498.4 39098.4 39498 40098 40698 41031.6 41564.4 42498 42964.8 43264.8 43664.4 43964.4 44497.2 45430.8 45730.8 46330.8 46863.6 47463.6 47797.2 48397.2 48997.2 49297.2 50163.6 50497.2 50830.8" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Using the GEM file I am sending labeled SPARREAR.GEM the problems I am having with</tspan></text><text y="29169.2" xml:space="preserve"><tspan x="7200 7867.2 8400 9000 9532.8 10200 10533.6 10933.2 11466 11998.8 12932.4 13232.4 13765.2 14298 14898 15364.8 15698.4 16298.4 16898.4 17198.4 17798.4 18398.4 18698.4 19431.6 20031.6 20564.4 21097.2 21697.2 22030.8 22364.4 22964.4 23564.4 24031.2 24331.2 24864 25396.8 25996.8 26296.8 26896.8 27429.6 27729.6 28129.2 28662 29061.6 29594.4 29994 30526.8 31059.6 31393.2 31926 32526 32826 33358.8 33825.6 34125.6 34525.2 35125.2 35458.8 35792.4 36392.4 37258.8 37725.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">PageStream causing #3 Exceptions can be re-created as follows:</tspan></text><text y="31569.2" xml:space="preserve"><tspan x="7200 7800 9600 10333.2 10933.2 11466 12066 12366 13033.2 13566 14166 14698.8 15366 15699.6 16099.2 16632 17164.8 18098.4 18398.4 18998.4 19298.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">1.Load PageStream 2.1</tspan></text><text y="33969.2" xml:space="preserve"><tspan x="7200 7800 9600 10267.2 10800 11133.6 11666.4 12199.2 12532.8 12832.8 13699.2 14232 15098.4 15398.4 16264.8 16864.8 17397.6 17997.6 18931.2 19464 20064 20397.6 20697.6 21097.2 21496.8 22096.8 23030.4 23330.4 23664 24264 24796.8 25096.8 26030.4 26563.2 26896.8 27496.8 27796.8 28730.4 29263.2 29863.2 30463.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">2.Select New Document from the main menu.</tspan></text><text y="36369.2" xml:space="preserve"><tspan x="7200 7800 9600 10267.2 10800 11133.6 11666.4 12199.2 12532.8 12832.8 13566 14098.8 14432.4 14766 15298.8 15698.4 15998.4 16665.6 16999.2 17532 18064.8 18364.8 18964.8 19264.8 19864.8 20164.8 21031.2 21331.2 21931.2 22531.2 22831.2 23230.8 24097.2 24630 25029.6 25562.4 26162.4 26496 26829.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">3.Select Letter Size 8.5 X 11 (Default)</tspan></text><text y="38769.2" xml:space="preserve"><tspan x="7200 7800 9600 10267.2 10800 11133.6 11666.4 12199.2 12532.8 12832.8 13633.2 14032.8 14565.6 15098.4 15432 15964.8 16264.8 17065.2 17665.2 17998.8 18598.8 19532.4 20132.4 20599.2 20899.2 21298.8 21698.4 22298.4 23232 23532 23865.6 24465.6 24998.4 25298.4 26365.2 26898 27231.6 27831.6 28131.6 29198.4 29731.2 30331.2 30931.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">4.Select Create Columns from the Main Menu.</tspan></text><text y="41169.2" xml:space="preserve"><tspan x="7200 7800 9600 10267.2 10800 11133.6 11666.4 12199.2 12532.8 12832.8 13432.8 13965.6 14365.2 14898 15498 15831.6 16165.2 16465.2 16864.8 17164.8 17764.8 18254.4 18554.4 19488 20020.8 20420.4 21020.4 21354 21954 22420.8 22720.8 23054.4 23587.2 23986.8 24320.4 24620.4 24920.4 25320 25653.6 26253.6 26853.6 27187.2 27487.2 27787.2 28120.8 28720.8 29320.8 29620.8 29920.8 30453.6 31053.6 31653.6 31953.6 32553.6 33153.6 33487.2 33820.8 34420.8 35354.4 35688 35988 36588 37188 37488 38020.8 38620.8 38954.4 39554.4 40488 41088 41388 41721.6 42055.2 42655.2 43255.2 43722 44022 44322 44922 45522 46455.6 47055.6 47588.4 47988 48288 48888 49287.6 49587.6 50120.4 50720.4 51054 51654 52587.6 53187.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">5.Select default - 1" margins left, right, top, and bottom; no column links, number of columns</tspan></text><text y="42369.2" xml:space="preserve"><tspan x="9576 10108.8 10641.6 11041.2 11641.2 12108 12574.8 12874.8 13551.6 13851.6 14451.6 14751.6 15051.6 15351.6 15951.6 16551.6 16851.6 17451.6 18051.6 18385.2 18718.8 19251.6 19651.2 19951.2 20251.2 20784 21384 21984 22284 22683.6 23083.2 23683.2 24616.8 24916.8 25516.8 26049.6 26649.6 27182.4 27649.2 27949.2 28549.2 28849.2 29182.8 29782.8 30082.8 30682.8 30982.8 31282.8 31682.4 32149.2 32749.2 33216 33549.6 33849.6 34382.4 34716 35049.6 35582.4 36182.4 36482.4 37082.4 37682.4 37982.4 38848.8 39715.2 40015.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">across = 1, .25 gutter, and from pages 1 to 1. (Just click on OK.)</tspan></text><text y="44769.2" xml:space="preserve"><tspan x="7200 7800 9600 10267.2 10800 11133.6 11666.4 12199.2 12532.8 12832.8 13232.4 14166 14766 15366 15765.6 16099.2 16399.2 17265.6 17665.2 18198 18798 19398 19731.6 20264.4 20731.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">6.Select Import Graphics.</tspan></text><text y="47169.2" xml:space="preserve"><tspan x="7200 7800 9600 10267.2 10800 11133.6 11666.4 12199.2 12532.8 12832.8 13500 14167.2 15033.6 15834 16634.4 17367.6 18234 19034.4 19334.4 20200.8 20934" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">7.Select SPARREAR.GEM</tspan></text><text y="49569.2" xml:space="preserve"><tspan x="7200 7800 9600 10466.4 10999.2 11398.8 11732.4 12332.4 12865.2 13165.2 13698 13998 14397.6 14797.2 15330 16263.6 16796.4 17096.4 17396.4 17796 18096 18696 19162.8 19695.6 19995.6 20395.2 20995.2 21328.8 21662.4 21962.4 22495.2 23095.2 23428.8 24028.8 24962.4 25562.4 25862.4 26728.8 27062.4 27662.4 27996 28596" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">8.Define a frame. I use full column width.</tspan></text><text y="51969.2" xml:space="preserve"><tspan x="7200 7800 9600 10466.4 11066.4 11599.2 12132 12432 12765.6 13365.6 13898.4 14198.4 14798.4 15198 15730.8 16597.2 16930.8 17530.8 18130.8 18430.8 18764.4 19231.2 19531.2 20131.2 20464.8 20931.6 21531.6 21865.2 22398 22998 23530.8 24130.8 24430.8 24897.6 25430.4 26030.4 26563.2 26863.2 27196.8 27796.8 28329.6 28629.6 29229.6 29829.6 30362.4 30962.4 31896 32428.8 33028.8 33362.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">9.Once the drawing is displayed save the document.</tspan></text><text y="54369.2" xml:space="preserve"><tspan x="7200 7800 8400 9600 10333.2 10933.2 11266.8 11600.4 11900.4 12567.6 13100.4 13700.4 14233.2 14900.4 15234 15633.6 16166.4 16699.2 17632.8" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">10.Exit PageStream.</tspan></text><text y="56769.2" xml:space="preserve"><tspan x="7200 7800 8400 9600 10400.4 10933.2 11400 11733.6 12266.4 12666 12999.6 13299.6 13966.8 14499.6 15099.6 15632.4 16299.6 16633.2 17032.8 17565.6 18098.4 19032 19332 19864.8 20198.4 20532 21132 21664.8 22064.4 22364.4 22897.2 23296.8 23630.4 24163.2 24562.8 24862.8 25395.6 25695.6 26095.2 26628 27027.6 27627.6 28227.6 28827.6 29161.2 29461.2 30061.2 30460.8 30760.8 31094.4 32028 32961.6 33494.4 34094.4 34428 34960.8 35294.4 35827.2 36160.8 36760.8 37060.8 37593.6 37993.2 38326.8 38859.6 39259.2 39559.2 40026 40558.8 41158.8 41492.4 42092.4 42692.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">11.Restart PageStream either after a re-boot or immediately after saving.</tspan></text><text y="59169.2" xml:space="preserve"><tspan x="7200 7800 8400 9600 10466.4 11066.4 11599.2 12199.2 12499.2 12832.8 13432.8 13965.6 14265.6 14865.6 15465.6 15998.4 16598.4 17532 18064.8 18664.8 18998.4 19298.4 19632 20232 20764.8 21098.4 21398.4 21998.4 22598.4 23198.4 23498.4 23965.2 24498 25098 25630.8 26230.8" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">12.Open the document that you saved.</tspan></text><text y="61569.2" xml:space="preserve"><tspan x="7200 7800 8400 9600 10333.2 10933.2 11466 11766 12298.8 12898.8 13232.4 13832.4 14766 15366 15666 16266 16866 17199.6 17533.2 17866.8 18466.8 18999.6 19299.6 20166 20499.6 20833.2 21166.8 21466.8 21999.6 22599.6 23199.6 23732.4 24265.2 24664.8 24964.8 25497.6 26097.6 26697.6 26997.6 27331.2 27931.2 28464 28764 29364 29964 30264 30997.2 31597.2 32130 32662.8 33262.8 33596.4 33930 34530 35130 35430 35829.6 36429.6 36729.6 37329.6 37929.6 38863.2 39463.2 39930 40329.6 40629.6 41496 41829.6 42163.2 42496.8 42796.8 43329.6 43929.6 44529.6 45062.4 45595.2 45994.8 46294.8 46894.8 47494.8 47794.8 48128.4 48728.4 49261.2 49561.2 49894.8 50427.6 50827.2 51160.8 51460.8 51993.6 52593.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">13.The column outline will appear and the #3 Exception (3 bombs) will appear on the left and</tspan></text><text y="62769.2" xml:space="preserve"><tspan x="9576 10176 10776 11376 11676 12542.4 12876 13209.6 13543.2 13843.2 14443.2 14976 15276 15876 16275.6 16875.6 17475.6 18075.6 18675.6 19009.2 19309.2 19909.2 20442 20974.8 21574.8 21874.8 22208.4 22808.4 23108.4 23442 24042 24574.8 24874.8 25474.8 26007.6 26474.4 27074.4 27408 28008 28608" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">you will be brought back to the desktop.</tspan></text><text y="65169.2" xml:space="preserve"><tspan x="7200 7933.2 8533.2 8866.8 9333.6 9633.6 10233.6 10633.2 11233.2 11766 12298.8 12898.8 13498.8 13898.4 14431.2 14731.2 15198 15798 16398 16998 17331.6 17931.6 18231.6 18764.4 19098 19431.6 20031.6 20898 21198 21798 22398 22998 23298 23631.6 24231.6 24531.6 24931.2 25464 25863.6 26396.4 26796 27328.8 27861.6 28195.2 28728 29028 29361.6 29961.6 30494.4 30794.4 31394.4 31794 32394 32994 33327.6 33860.4 34794 35094 35427.6 36027.6 36560.4 36960 37492.8 37792.8 38092.8 38492.4 38792.4 39392.4 39925.2 40525.2 41058 41358 41691.6 42291.6 42758.4 43092 43392 44325.6 44858.4 45458.4 46058.4 46358.4 47292 47824.8 48424.8 49024.8 49324.8 49924.8 50524.8 51124.8 51524.4 51991.2 52291.2 52891.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">This procedure should allow you to re-create the problem there. I have lost many many hours of</tspan></text><text y="66369.2" xml:space="preserve"><tspan x="7200 8066.4 8666.4 9066 9666 9966 10566 11166 11698.8 11998.8 12332.4 12932.4 13232.4 13566 14166 14499.6 14966.4 15266.4 15866.4 16466.4 17066.4 17366.4 17666.4 18066 18366 18966 19566 20166 21032.4 21332.4 21666 22266 22798.8 23132.4 23432.4 24032.4 24632.4 25232.4 25532.4 26065.2 26598 27198 27498 28098 28630.8 28964.4 29264.4 29598 29931.6 30231.6 30631.2 31164 31630.8 32230.8 32564.4 33164.4 33697.2 34297.2 34597.2 35197.2 35797.2 36330 36862.8 37162.8 37762.8 38362.8 38962.8 39262.8 39795.6 40395.6 40995.6 41295.6 42028.8 42561.6 43161.6 43561.2 44161.2 44694 45093.6 45693.6 45993.6 46526.4 47059.2 47659.2 47959.2 48358.8 48891.6 49424.4 49758 50091.6 50691.6 50991.6 51458.4 51991.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">work due to this bug. I know that you can get it resolved once you and Leornard can really see</tspan></text><text y="67569.2" xml:space="preserve"><tspan x="7200 8066.4 8666.4 9199.2 9532.8 9832.8 10166.4 10633.2 10933.2 11533.2 12133.2 12466.8 13066.8 13666.8 13966.8 14566.8 15166.8 15466.8 15766.8 16633.2 17233.2 17766 18099.6 18699.6 18999.6 19299.6 20233.2 20833.2 21133.2 21600 21933.6 22533.6 23066.4 23599.2 23998.8 24531.6 24831.6 25165.2 25765.2 26298 26898 27498 27964.8" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">what is going on. Again, my sincere thanks.</tspan></text><text y="71169.2" xml:space="preserve"><tspan x="7200 8266.8 8799.6 9199.2 9532.8 10132.8 10432.8 11100 11632.8 12232.8 12832.8 13432.8 13965.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Marty Pennock</tspan></text></g>

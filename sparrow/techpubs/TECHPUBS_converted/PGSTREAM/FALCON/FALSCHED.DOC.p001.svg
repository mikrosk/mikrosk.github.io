mes, 'Liberation Serif', serif" font-weight="bold" text-decoration="underline">Text Creation</tspan></text><text y="33369.2" xml:space="preserve"><tspan x="7200 8266.8 8799.6 9399.6 9999.6 10532.4 10866 11257.6 11591.2 12124 12724 13057.6 13449.2 13982 14381.6 14914.4 15447.2 15780.8 16114.4 16714.4 17314.4 17706 18105.6 18505.2 19105.2 20038.8 20430.4 20897.2 21430 21829.6 22362.4 22696 23228.8 23828.8 24220.4 24554 25154 25754 26354 26687.6 27287.6 27621.2 28221.2 28821.2 29212.8 29812.8 30345.6 30945.6 31279.2 31879.2 32479.2 32870.8 33204.4 33804.4 34196 34728.8 35328.8 35662.4 36195.2 36594.8 36986.4 37320 37920 38452.8 38844.4 39178 39710.8 40310.8 40644.4 41036 41435.6 41835.2 42435.2 43368.8 43760.4 44227.2 44760 45159.6 45692.4 46026 46558.8 47158.8 47550.4 48416.8 48750.4 49084 49684 50075.6 50675.6 51275.6 51667.2 52267.2 52666.8 53000.4 53600.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Manual text creation from scratch involving having to enter the text from scratch with no prior</tspan></text><text y="34569.2" xml:space="preserve"><tspan x="7200 7533.6 8133.6 8533.2 9133.2 9532.8 10466.4 10999.2 11332.8 11666.4 12266.4 12866.4 13221.7 13821.7 14221.3 14754.1 15220.9 15753.7 16353.7 16687.3 17042.5 17642.5 18242.5 18597.8 19197.8 19730.6 20330.6 20863.4 21263 21618.3 22218.3 22617.9 22973.2 23372.8 23706.4 24306.4 24906.4 25506.4 26106.4 26461.6 26795.2 27395.2 27928 28261.6 28616.9 29149.7 29682.5 30282.5 30637.8 31237.8 31770.6 32125.8 32725.8 33192.6 33725.4 34325.4 34625.4 34980.7 35781.1 36180.7 36713.5 37246.3 37579.9 37913.5 38513.5 39113.5 39468.8 40068.8 40468.4 40823.6 41157.2 41690 42290 42623.6 42978.9 43378.5 43778.1 44378.1 45311.7 45667 46000.6 46600.6 46934.2 47401 47756.3 48089.9 48689.9 49289.9 49822.7 50177.9 50777.9 51177.5 51532.8 51866.4 52466.4 53066.4 53666.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">information present on paper or floppy that can be used. Creation of text from this type of input</tspan></text><text y="35769.2" xml:space="preserve"><tspan x="7200 7666.8 8266.8 8866.8 9466.8 9800.4 10400.4 10718.6 11118.2 11718.2 12318.2 12636.3 13236.3 13836.3 14235.9 14835.9 15435.9 15754.1 16620.5 17220.5 17620.1 18220.1 18553.7 19153.7 19753.7 20071.8 20671.8 21204.6 21804.6 22271.4 22571.4 22889.6 23622.8 24222.8 24556.4 25023.2 25341.4 25675 26207.8 26807.8 27340.6 27807.4 28125.5 28525.1 29125.1 29524.7 29842.9 30442.9 30842.5 31375.3 31975.3 32308.9 32841.7 33441.7 33759.8 34093.4 34693.4 35226.2 35559.8 35878 36478 36811.6 37411.6 37944.4 38344 38662.2 39129 39661.8 40261.8 40794.6 41394.6 41994.6 42328.2 42861 43327.8 43645.9 44245.9 44778.7 45178.3 46111.9 46445.5 46779.1 47097.3 47496.9 48096.9 48430.5 48764.1 49082.2 49415.8 49749.4 50683 51215.8 51534 52400.4 53000.4 53400" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">should run 15-20 working days. This takes for granted that other schedules permit full time work</tspan></text><text y="36969.2" xml:space="preserve"><tspan x="7200 7800 8400 8792 9324.8 9924.8 10258.4 10791.2 11190.8 11524.4 12124.4 12724.4 13116.4 13450 14050 14582.8 14974.9 15308.5 15908.5 16242.1 16842.1 17234.1 17567.7 18167.7 18700.5 19092.5 19559.3 20159.3 20626.1 20959.7 21492.5 22426.1 22818.1 23350.9 23950.9 24550.9 24943 25276.6 25876.6 26409.4 26743 27135 27735 28267.8 28734.6 29267.4 29659.4 29993 30593 30992.6 31592.6 31992.2 32925.8 33458.6 33792.2 34125.8 34725.8 35325.8 35717.8 36184.6 36784.6 37317.4 37917.4 38309.5 38842.3 39309.1 39701.1 40301.1 40833.9 41167.5 41700.3 42092.3 42559.1 43159.1 43691.9 44224.7 44558.3 45025.1 45417.1 45949.9 46549.9 47149.9 47542 48008.8 48541.6 49141.6 49674.4 50608 51140.8 51474.4 51808 52340.8 52807.6 53199.6 53533.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">on entering the into the system and that base information such as data sheets and schematics is</tspan></text><text y="38169.2" xml:space="preserve"><tspan x="7200 7732.8 8332.8 8865.6 9199.2 9532.8 10065.6 10665.6 10999.2 11532" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">available.</tspan></text><text y="41769.2" xml:space="preserve"><tspan x="7200 8109.7 8529.3 9088.7 9998.5 10348.7 10978.7 11608.7 11923.7 12624.3 12974.6 13604.6 14234.6 14654.2 15213.6 15528.6 16369 16788.6 17348 17907.5 18257.8 18608 19238" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-weight="bold" text-decoration="underline">Drawing Figure Creation</tspan></text><text y="44169.2" xml:space="preserve"><tspan x="7200 7867.2 8467.2 9400.8 9933.6 10244.9 10844.9 11244.5 11777.3 12643.7 12977.3 13577.3 14177.3 14644.1 14955.5 15555.5 16155.5 16466.8 16999.6 17599.6 17933.2 18400 18733.6 19044.9 19378.5 19978.5 20289.9 20623.5 21223.5 21756.3 22067.6 22934 23534 24066.8 24378.1 25178.5 25711.3 26311.3 26644.9 27177.7 27577.3 27888.7 28421.5 29021.5 29621.5 29932.8 30799.2 31132.8 31466.4 31800 32111.3 32711.3 33244.1 33555.5 34088.3 34688.3 35288.3 35888.3 36421.1 36820.7 37154.3 37687.1 38287.1 38598.4 38932 39532 39843.3 40709.7 41576.1 42243.3 42554.7 42888.3 43488.3 44088.3 44621.1 44932.4 45332 45665.6 45999.2 46532 46998.8 47310.1 47842.9 48442.9 49042.9 49354.3 49687.9 50287.9 50887.9 51487.9 51821.5 52132.8 52466.4 53066.4 53400" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Some drawings do exist in the Doc Center and will be converted to DXF type files and input into</tspan></text><text y="45369.2" xml:space="preserve"><tspan x="7200 7533.6 8133.6 8666.4 8995.2 9861.6 10461.6 11061.6 11594.4 12394.8 13261.2 14127.6 14994 15322.8 15922.8 16455.6 16988.4 17588.4 18121.2 18721.2 19254 19582.8 20182.8 20516.4 20916 21448.8 21981.6 22315.2 22648.8 23248.8 23548.8 23877.6 24610.8 25210.8 25544.4 26011.2 26340 27273.6 27806.4 28140 28740 29340 29940 30268.8 31135.2 31735.2 32335.2 32668.8 33268.8 33597.6 33931.2 34464 35064 35596.8 35925.6 36525.6 36925.2 37525.2 37854 38454 39054 39654 40053.6 40520.4 40849.2 41449.2 41982 42381.6 42710.4 43310.4 43710 44242.8 45109.2 45442.8 46042.8 46642.8 46971.6 47305.2 47905.2 48234 48766.8 49299.6 49832.4 50432.4 51366 51966 52299.6 52633.2 53100 53700" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">the DynaCADD package directly. This method would take 1-2 hours per drawing to accomplish.</tspan></text><text y="46569.2" xml:space="preserve"><tspan x="7200 8066.4 8422.5 8756.1 9356.1 9689.7 10222.5 10556.1 10912.2 11512.2 11911.8 12267.8 12867.8 13467.8 13867.4 14467.4 15067.4 15423.5 16023.5 16423.1 16955.9 17822.3 18155.9 18755.9 19355.9 19822.7 20178.8 20711.6 21111.2 21644 22000.1 22600.1 23132.9 23665.7 24265.7 24798.5 25398.5 25698.5 26054.6 26921 27521 27854.6 28387.4 28987.4 29343.4 30209.8 30543.4 30877 31210.6 31566.7 31900.3 32433.1 33033.1 33565.9 33922 34454.8 35054.8 35654.8 36054.4 36654.4 37254.4 37588 38521.6 39054.4 39388 39920.8 40254.4 40854.4 41210.5 41810.5 42410.5 42810.1 43410.1 44010.1 44366.2 44966.2 45566.2 46166.2 46565.8 47032.6 47332.6 47688.6 48288.6 48688.2 49044.3 49644.3 50000.4 50866.8 51466.8 51866.4 52466.4 52800 53400" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">A total of 15-19 drawings are needed, which will take approximately 30-40 hours, or 5 working</tspan></text><text y="47769.2" xml:space="preserve"><tspan x="7200 7800 8332.8 8932.8 9399.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">days.</tspan></text><text y="51369.2" xml:space="preserve"><tspan x="7200 7969.9 8529.3 9159.3 9789.3 10419.3" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-weight="bold" text-decoration="underline">Layout</tspan></text><text y="53769.2" xml:space="preserve"><tspan x="7200 7933.2 8466 9066 9666 10266 10599.6 11171.2 12037.6 12371.2 12704.8 13038.4 13610 14210 14742.8 15342.8 15875.6 16275.2 16808 17141.6 17475.2 18075.2 18646.8 19246.8 19779.6 20379.6 20912.4 21512.4 22112.4 22684 23284 23884 24455.6 24789.2 25389.2 25922 26493.6 26960.4 27294 27826.8 28359.6 28931.2 29531.2 29930.8 30502.4 30836 31436 31968.8 32540.4 33474 34006.8 34606.8 35206.8 35739.6 36073.2 36644.8 37244.8 37777.6 38111.2 38711.2 39311.2 39882.8 40482.8 40882.4 41482.4 42082.4 42682.4 43215.2 43748 44348 44648 45219.6 45619.2 46190.8 47057.2 47657.2 48257.2 48590.8 49190.8 49762.4 50362.4 50895.2 51362 51894.8 52466.4 53400" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Layout will generally depend on the size of the manual being produced. I would base my</tspan></text><text y="54969.2" xml:space="preserve"><tspan x="7200 7732.8 8199.6 8533.2 8866.8 9800.4 10333.2 10666.8 11199.6 11666.4 11966.4 12566.4 13166.4 13466.4 14066.4 14466 15066 15366 15966 16498.8 17098.8 17631.6 18098.4 18398.4 18998.4 19531.2 19930.8 20230.8 20830.8 21363.6 21963.6 22263.6 22563.6 23296.8 23896.8 24230.4 24697.2 24997.2 25863.6 26463.6 27063.6 27397.2 27997.2 28297.2 28830 29430 30030 30562.8 30896.4 31429.2 31729.2 32062.8 32662.8 32962.8 33562.8 34162.8 34462.8 35062.8 35595.6 36195.6 36662.4 36962.4 37828.8 38428.8 38828.4 39295.2 39628.8 39928.8 40461.6 40994.4 41461.2 41994 42294 42826.8 43426.8 44026.8 44326.8 44926.8 45526.8 45826.8 46426.8 46959.6 47559.6 48026.4 48326.4 48926.4 49459.2 49926 50259.6 50559.6 51092.4 51625.2 52092 52624.8" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">estimates on 3-7 pages per day. This would equate to 20 days worst case and 10 days best case.</tspan></text><text y="60969.2" xml:space="preserve"><tspan x="49467.6 50134.8 50468.4 51068.4 51601.2 52134 52533.6 53066.4 53400" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Sincerely</tspan></text><text y="66969.2" xml:space="pres
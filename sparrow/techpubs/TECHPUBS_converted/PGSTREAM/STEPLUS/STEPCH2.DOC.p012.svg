<g><rect x="7252" y="7043" width="46798" height="58166" fill="#fff" stroke="none"/><text y="8012.2" xml:space="preserve"><tspan x="7252 8118.4 8585.2 8885.2 9418 9718 10117.6 10650.4 11117.2 11717.2 12050.8 12384.4 12684.4 13018 13618 14150.8 14450.8 15317.2 15984.4 16850.8 17150.8 17484.4 17951.2 18251.2 18851.2 19451.2 19751.2 20084.8 20684.8 21284.8 21884.8 22417.6 22817.2 23117.2 23650 24250 24782.8 25116.4 25450 25982.8 26582.8 26916.4 27449.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">As a result the GPO is no longer available.</tspan></text><text y="11612.2" xml:space="preserve"><tspan x="7252 7952.6 8302.8 9003.4 9353.7 10054.2 10404.5 11105.1 11455.4 12504.9 13205.5 13906.1 14185.8 14536.1 15236.6 15656.2 16006.5 16356.8 17057.3 17757.9 18458.4 18808.7 19438.7" font-size="1200" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-weight="bold">2.2.1.6 Monitor Inputs:</tspan></text><text y="15212.2" xml:space="preserve"><tspan x="7252 8118.4 8785.6 9652 10518.4 16852 17585.2 18318.4 19051.6 19351.6 19685.2 20218 20818 21350.8 21684.4 21984.4 22284.4 22884.4 23417.2 24017.2 24550 24883.6 25217.2 25817.2 26350 26650 26950 27550 27850 28450 29050 29350 29950 30550 31483.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">HSYNCTTL level, negative, 3.3k ohm.</tspan></text><text y="16412.2" xml:space="preserve"><tspan x="7252 8118.4 8785.6 9652 10518.4 16852 17585.2 18318.4 19051.6 19351.6 19685.2 20218 20818 21350.8 21684.4 21984.4 22284.4 22884.4 23417.2 24017.2 24550 24883.6 25217.2 25817.2 26350 26650 26950 27550 27850 28450 29050 29350 29950 30550 31483.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">VSYNCTTL level, negative, 3.3k ohm.</tspan></text><text y="17612.2" xml:space="preserve"><tspan x="7252 8318.8 8918.8 9518.8 10118.8 10651.6 11251.6 11651.2 12251.2 13184.8 16852 17718.4 18052 18652 18985.6 19319.2 19852 20185.6 20485.6 21085.6 21385.6 21985.6 22285.6 23152 23752 24352 24652 24952 25552 26152 26452 27052 27652 28585.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">MonochromeDigital 1.0 Vpp, 75 ohm.</tspan></text><text y="18812.2" xml:space="preserve"><tspan x="7252 8052.4 8918.8 9719.2 10019.2 10885.6 11485.6 12018.4 12352 12952 18052 18652 19051.6 19651.6 19951.6 20551.6 20851.6 21718 22318 22918 23218 23518 24118 24718 25018 25618 26218 27151.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">RGB Analog0-1.0 Vpp, 75 ohm.</tspan></text><text y="20012.2" xml:space="preserve"><tspan x="7252 8118.4 8718.4 9318.4 9652 16852 17452 17752 18618.4 19218.4 19818.4 20118.4 20418.4 21018.4 21618.4 21918.4 22518.4 23118.4 24052" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Audio1 Vpp, 1k ohm.</tspan></text><text y="23612.2" xml:space="preserve"><tspan x="7252 7952.6 8302.8 9003.4 9353.7 10054.2 10404.5 11105.1 11455.4 12504.9 13205.5 13906.1 14185.8 14536.1 15236.6 15656.2 16006.5 16846.9 17126.6 17827.2 18527.7 19228.3" font-size="1200" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-weight="bold">2.2.1.7 Monitor Pinout</tspan></text><text y="27212.2" xml:space="preserve"><tspan x="7252 7952.6 8302.8 12052 12752.6 13102.8 13732.8 14362.8 14922.3" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-weight="bold" text-decoration="underline">PinSignal</tspan></text><text y="29612.2" xml:space="preserve"><tspan x="7252 12052 12918.4 13518.4 14118.4 14452 15052 15352 16218.4 16818.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">1Audio Out</tspan></text><text y="30812.2" xml:space="preserve"><tspan x="7252 12052 12852.4 13452.4 14386 14986 15586 16052.8 16386.4 16720 17252.8 17552.8 18419.2 18752.8 19352.8 19885.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">2Composite Video</tspan></text><text y="32012.2" xml:space="preserve"><tspan x="7252 12052 12918.4 13451.2 14051.2 14584 14983.6 15516.4 15850 16150 16817.2 17417.2 17816.8 18416.8 19016.8 19483.6 20016.4 20316.4 21182.8 21782.8 22116.4 22716.4 23316.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">3General Purpose Output</tspan></text><text y="33212.2" xml:space="preserve"><tspan x="7252 12052 13118.8 13718.8 14318.8 14918.8 15451.6 16051.6 16451.2 17051.2 17984.8 18517.6 18817.6 19684 20216.8 20550.4 21083.2 21616" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">4Monochrome Detect</tspan></text><text y="34412.2" xml:space="preserve"><tspan x="7252 12052 12918.4 13518.4 14118.4 14452 15052 15352 15751.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">5Audio In</tspan></text><text y="35612.2" xml:space="preserve"><tspan x="7252 12052 12918.4 13318 13850.8 14383.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">6Green</tspan></text><text y="36812.2" xml:space="preserve"><tspan x="7252 12052 12852.4 13385.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">7Red</tspan></text><text y="38012.2" xml:space="preserve"><tspan x="7252 12052 12728.8 13328.8 13928.8 14228.8 15095.2 15695.2 16028.8 16362.4 16662.4 17329.6 17929.6 18263.2 18596.8 19196.8" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">8+12 Volt Pullup</tspan></text><text y="39212.2" xml:space="preserve"><tspan x="7252 12052 12918.4 13518.4 13918 14251.6 14784.4 15384.4 15984.4 16318 16850.8 17184.4 17484.4 18151.6 18751.6 19351.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">9Horizontal Sync</tspan></text><text y="40412.2" xml:space="preserve"><tspan x="7252 7852 12052 12852.4 13186 13786" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">10Blue</tspan></text><text y="41612.2" xml:space="preserve"><tspan x="7252 7852 12052 13118.8 13718.8 14318.8 14918.8 15451.6 16051.6 16451.2 17051.2 17984.8" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">11Monochrome</tspan></text><text y="42812.2" xml:space="preserve"><tspan x="7252 7852 12052 12918.4 13451.2 13850.8 14184.4 14518 15050.8 15583.6 15917.2 16217.2 16884.4 17484.4 18084.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">12Vertical Sync</tspan></text><text y="44012.2" xml:space="preserve"><tspan x="7252 7852 12052 12918.4 13318 13918 14518 15118" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">13Ground</tspan></text><text y="47935.3" xml:space="preserve"><tspan x="7252 8186.1 8653.1 9587.2 10054.2 10988.3 11455.4 12575.9 13788.9 15001.8 15468.9 16775.9 17243 18363.5 19576.5 20697 21817.6 22938.2 24058.7 25085.2 26205.8" font-size="1600" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-weight="bold">2.2.2 AUDIO SUBSYSTEM</tspan></text><text y="51612.2" xml:space="preserve"><tspan x="7252 7952.6 8302.8 9003.4 9353.7 10054.2 10404.5 11105.1 11455.4 12295.8 12996.3 13696.9 13976.6 14677.2 15027.5 16007.7 16708.3 17058.6 17759.1 18459.7 18810 19160.3 20140.5 20770.5 21471.1 21890.7 22520.7 22800.4 23501" font-size="1200" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-weight="bold">2.2.2.1 Audio Output Overview</tspan></text><text transform="translate(10818.4 55212.2) scale(1.2 1)" x="0" xml:space="preserve" font-size="1000" font-family="'Times New Roman', Times, 'Liberation Serif', serif">E</text><text y="55212.2" xml:space="preserve"><tspan x="7252 7985.2 8585.2 9118 9418 10085.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">The ST</tspan><tspan x="11551.6 12228.4 12528.4 13128.4 13661.2 14128 14428 14960.8 15260.8 15860.8 16260.4 16860.4 17460.4 17860 18392.8 19326.4 20260 20792.8 21392.8 21726.4 22259.2 22559.2 23026 23626 24226 24826 25426 25726 26258.8 26858.8 27192.4 27792.4 28092.4 28625.2 29225.2 29825.2 30125.2 30725.2 31124.8 31724.8 32058.4 32392 32692 33158.8 33492.4 34025.2 34424.8 34957.6 35557.6 35857.6 36724 37790.8 38657.2 38957.2 39490 39823.6 40123.6 40723.6 41023.6 41623.6 41957.2 42490 43090 43690 44222.8 44755.6 45355.6 45655.6 46055.2 46454.8 46987.6 47587.6 48187.6 48720.4 49320.4 49853.2 50186.8 50719.6 51186.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">+ has a programmable sound chip and 8-bit stereo DMA at 4 playback frequencies.</tspan></text><text y="57612.2" xml:space="preserve"><tspan x="7252 7919.2 8519.2 9119.2 9719.2 10319.2 10619.2 10952.8 11419.6 11719.6 12186.4 12520 13120 13519.6 14052.4 14652.4 14952.4 15286 15886 16186 17119.6 17652.4 18586 19186 19585.6 20185.6 20485.6 21018.4 21485.2 21785.2 22385.2 22718.8 23318.8 23652.4 23986 24319.6 24852.4 25385.2 25985.2 26285.2 26752 27284.8 28218.4 28818.4 29152 29684.8 30151.6 30451.6 30751.6 31484.8 32017.6 32550.4 33150.4 33450.4 33917.2 34450 35383.6 35983.6 36317.2 36850 37150 37483.6 37950.4 38250.4 38783.2 39083.2 39683.2 40283.2 41216.8 41816.8 42349.6 42749.2 43049.2 43349.2 43748.8 44148.4 44748.4 45682 45982 46381.6 46981.6 47581.6 48181.6 48481.6 48815.2 49415.2 49715.2 50392 50992 51592 52192" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Sound is stored in memory as digitized samples. Each sample is a number, from -128 to +127,</tspan></text><text y="58812.2" xml:space="preserve"><tspan x="7252 8118.4 8718.4 9052 9584.8 10184.8 10484.8 10884.4 11417.2 12017.2 12416.8 12949.6 13416.4 13949.2 14549.2 14882.8 15349.6 15649.6 16249.6 16583.2 17050 17650 17983.6 18516.4 19049.2 19582 20515.6 21048.4 21648.4 21982 22282 22882 23281.6 23581.6 23915.2 24515.2 25048 25348 25814.8 26414.8 26947.6 27480.4 28080.4 28613.2 29012.8 29312.8 29712.4 30112 30712 31645.6 31945.6 32279.2 32879.2 33412 33712 34201.6 34801.6 35334.4 35934.4 36268 36667.6 37200.4 37534 38023.6 38323.6 38923.6 39323.2 39623.2 40556.8 40890.4 41490.4 42090.4 42424 42956.8 43256.8 43856.8 44456.8 44923.6 45257.2 45590.8 45924.4 46524.4 47124.4 47424.4 47724.4 48590.8 49190.8 49590.4 49924 50524" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">which represents displacement of the speaker from the "neutral" or middle position. During</tspan></text><text y="60012.2" xml:space="preserve"><tspan x="7252 7852 8452 8851.6 9185.2 9718 10318 10918 11251.6 11784.4 12118 12418 13018 13351.6 13884.4 14484.4 15084.4 15418 16018 16618 16918 17317.6 17651.2 18050.8 18583.6 19183.6 19650.4 20250.4 20783.2 21182.8 21715.6 22315.6 22649.2 22949.2 23282.8 23882.8 24182.8 24516.4 25116.4 25649.2 25949.2 26549.2 26948.8 27548.8 28081.6 28614.4 29081.2 29548 30148 30547.6 30947.2 31247.2 31580.8 32180.8 32713.6 33013.6 33880 34946.8 35813.2 36113.2 36580 37180 37780 38380 38980 39280 39812.8 40412.8 40746.4 41346.4 41646.4 42046 42578.8 42912.4 43445.2 44045.2 44578 45044.8 45344.8 45811.6 46344.4 47278 47878 48211.6 48744.4 49211.2 49511.2 49910.8 50310.4 50910.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">horizontal blanking (transparent to the processor) the DMA sound chip fetches samples from</tspan></text><text y="61212.2" xml:space="preserve"><tspan x="7252 8185.6 8718.4 9652 10252 10651.6 11251.6 11551.6 12084.4 12684.4 13284.4 13584.4 14184.4 14584 15184 15784 16117.6 16717.6 17250.4 17717.2 18017.2 18350.8 18950.8 19483.6 20417.2 20717.2 21050.8 21650.8 21950.8 22483.6 22783.6 23383.6 23717.2 24317.2 24650.8 24984.4 25517.2 25850.8 26250.4 26584 27184 27583.6 28116.4 28716.4 29249.2 29582.8 30182.8 30782.8 31082.8 31615.6 32215.6 32815.6 33415.6 33948.4 34348 34681.6 35214.4 35614 35914 36313.6 37180 38046.4 38846.8 39246.4 39546.4 40079.2 40412.8 40712.8 41312.8 41912.8 42445.6 42745.6 43345.6 43745.2 44045.2 44512 45044.8 45644.8 46177.6 46577.2 47110 47443.6 47743.6 48276.4 48876.4 49476.4 49943.2 50276.8 50809.6 51409.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">memory and provides them to a digital-to-analog converter (DAC) at one of several constant</tspan></text><text y="62412.2" xml:space="preserve"><tspan x="7252 7651.6 8184.4 8518 9050.8 9517.6 9817.6 10117.6 10717.6 11117.2 11717.2 12317.2 12716.8 13249.6 14183.2 15116.8 15649.6 16249.6 16583.2 17116 17416 17948.8 18415.6 18715.6 19115.2 19648 20248 20848 21247.6 21847.6 22447.6 22781.2 23714.8 24247.6 24581.2 25114 25447.6 26047.6 26447.2 26747.2 27347.2 27947.2 28247.2 28847.2 29713.6 30246.4 30546.4 30946 31546 31879.6 32213.2 32813.2 33413.2 33946 34345.6 34679.2 35212 35611.6 35911.6 36211.6 36811.6 37411.6 37711.6 38311.6 39178 39710.8 40010.8 40310.8 40910.8 41510.8 41810.8 42410.8 42710.8 43310.8 44177.2 44710 45010 45310 45842.8 46442.8 47042.8 47342.8 47942.8 48242.8 48842.8 49442.8 49742.8 50342.8 51209.2 51742" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">rates, programmable as (approximately) 50 kHz (kilohertz), 25 kHz, 12.5 kHz, and 6.25 kHz.</tspan></text><text y="63612.2" xml:space="preserve"><tspan x="7252 7985.2 8585.2 8918.8 9385.6 9685.6 10085.2 10618 10951.6 11484.4 11784.4 12118 12584.8 12884.8 13417.6 13950.4 14284 14617.6 15150.4 15750.4 16050.4 16384 16984 17516.8 17816.8 18283.6 18816.4 19750 20350 20683.6 21216.4 21516.4 21916 22315.6 22848.4 23448.4 24048.4 24581.2 25181.2 25714 26314" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">This rate is called the sample frequency.</tspan></text></g>

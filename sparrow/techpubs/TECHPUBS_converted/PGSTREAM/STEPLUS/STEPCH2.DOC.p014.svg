<text y="74608.2" xml:space="preserve"><tspan x="30458 31058" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">14</tspan></text>
<g><rect x="7200" y="7200" width="46800" height="64800" fill="#fff" stroke="none"/><text y="8169.2" xml:space="preserve"><tspan x="7200 7900.6 8250.8 8951.4 9301.7 10002.2 10352.5 11053.1 11403.4 12452.9 13153.5 13854.1 14484.1 15184.6 15534.9 16164.9 16865.5 17495.5 18125.5 18475.7 18755.5 19385.5 20015.5" font-size="1200" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-weight="bold">2.3.1.1 Mouse/Joysticks</tspan></text><text y="11769.2" xml:space="preserve"><tspan x="7200 7933.2 8533.2 9066 9366 9966 10266 11066.4 11666.4 12000 12333.6 12933.6 13533.6 13833.6 14900.4 15500.4 16100.4 16567.2 17100 17400 17733.6 18200.4 18500.4 19033.2 19633.2 19933.2 20533.2 21133.2 21466.8 22066.8 22466.4 23400 23932.8 24465.6 25065.6 25598.4 26198.4 26532 27064.8 27597.6 27931.2 28231.2 28831.2 29364 29964 30297.6 30830.4 31363.2 31663.2 32529.6 32863.2 33196.8 33796.8 34096.8 34430.4 35030.4 35563.2 35863.2 36262.8 36862.8 37196.4 37530 38130 38996.4 39330 39930 40530 40830 41362.8 41962.8 42495.6 42895.2 43428 43960.8 44294.4 44827.2 45226.8 45560.4 46027.2 46360.8 46694.4 47227.2 47694 48027.6 48327.6 48860.4 49160.4 49560 50092.8 50559.6 51159.6 51493.2 52093.2 52426.8 52760.4 53360.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">The 2 Button Mouse is an opto-mechanical device with the following characteristics: a resolution</tspan></text><text y="12969.2" xml:space="preserve"><tspan x="7200 7800 8199.6 8499.6 9099.6 9699.6 10299.6 10599.6 11132.4 11732.4 12332.4 12932.4 13266 13732.8 14066.4 14400 15000 15532.8 16132.8 16432.8 16732.8 17265.6 17565.6 18499.2 19032 19632 19965.6 20899.2 21499.2 22432.8 22732.8 23332.8 23865.6 24199.2 24799.2 25332 25665.6 25999.2 26599.2 26899.2 27499.2 27898.8 28198.8 28798.8 29398.8 29698.8 30032.4 30632.4 31165.2 31765.2 32298 32764.8 33098.4 33565.2 34098 34630.8 35230.8 35830.8 36430.8 36730.8 37263.6 37863.6 38463.6 38763.6 39296.4 39596.4 40530 41062.8 41662.8 41996.4 42930 43530 44463.6 44763.6 45363.6 45963.6 46297.2 46764 47296.8 47596.8 48196.8 48796.8 49329.6 49796.4 50329.2 50629.2 51162 51561.6 51961.2 52561.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">of 100 counts/inch, a maximum velocity of 10 inches/second and a maximum pulse phase error</tspan></text><text y="14169.2" xml:space="preserve"><tspan x="7200 7800 8199.6 8499.6 9099.6 9699.6 9999.6 10599.6 11132.4 11532 12064.8 12597.6 13197.6 13531.2 13831.2 14131.2 14864.4 15464.4 15997.2 16297.2 16630.8 17230.8 17830.8 18297.6 18631.2 18964.8 19497.6 20097.6 20431.2 21364.8 21964.8 22564.8 23031.6 23564.4 23864.4 24464.4 25064.4 25464 25797.6 26097.6 26697.6 27230.4 27697.2 27997.2 28330.8 28930.8 29530.8 30130.8 30464.4 30931.2 31231.2 31630.8 32230.8 32630.4 32930.4 33530.4 34130.4 34430.4 34730.4 35330.4 35930.4 36796.8 37396.8 37696.8 37996.8 38330.4 38863.2 39262.8 39596.4 39896.4 40196.4 40596 40929.6 41529.6 42129.6 42463.2 42763.2 43063.2 43462.8 43796.4 44396.4 44996.4 45330 45630 46230 46830 47163.6 47497.2 48097.2 48697.2 48997.2 49297.2 49630.8 50163.6 50563.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">of 50 percent. The joystick/mouse port has inputs for up, down, left, right, right button, left</tspan></text><text y="15369.2" xml:space="preserve"><tspan x="7200 7800 8400 8733.6 9067.2 9667.2 10267.2 10567.2 10867.2 11600.4 12200.4 12733.2 13033.2 13432.8 13766.4 14366.4 14966.4 15300 15600 16200 16800 17133.6 17467.2 18067.2 18667.2 18967.2 19500 20100 20700 21232.8 21566.4 22033.2 22333.2 22666.8 23266.8 23799.6 24099.6 24433.2 25033.2 25633.2 26100 26433.6 26767.2 27300 27900 28200 28533.6 28933.2 29266.8 29866.8 30466.8 30999.6 31399.2 31699.2 31999.2 32332.8 32932.8 33465.6 33765.6 34099.2 34632 35031.6 35365.2 35665.2 36265.2 36865.2 37198.8 37532.4 38132.4 38732.4 39032.4 39366 39832.8 40132.8 40999.2 41332.8 41732.4 42265.2 42865.2 43165.2 43498.8 44098.8 44398.8 44732.4 45332.4 45865.2 46165.2 46632 47164.8 47697.6 48297.6 48897.6 49497.6 49797.6 50131.2 50731.2 51331.2 51798 52131.6 52465.2 52998" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">button. The right button equals the joystick trigger, the left button is wired to the second joystick</tspan></text><text y="16569.2" xml:space="preserve"><tspan x="7200 7800 8400 8799.6 9133.2 9433.2 9766.8 10166.4 10500 11100 11700 12232.8 12632.4 12932.4 13232.4 13965.6 14565.6 15098.4 15398.4 15732 16332 16932 17398.8 17732.4 18066 18598.8 19198.8 19498.8 20098.8 20631.6 21098.4 21398.4 21798 22398 22998 23397.6 23697.6 24297.6 24631.2 25030.8 25563.6 26096.4 26430 26763.6 27363.6 27963.6 28430.4 28730.4 29130 29730 30330 30630 30930 31530 32130 32996.4 33596.4 33896.4 34196.4 34729.2 35062.8 35595.6 35895.6 36295.2 36595.2 37128 37728 38328 38628 39228 39828 40360.8 40660.8 40994.4 41394 41727.6 42327.6 42927.6 43460.4 43860" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">port trigger. The joystick has four directions (up, down, etc.) and one trigger.</tspan></text><text y="18969.2" xml:space="preserve"><tspan x="7200 8109.7 8739.7 9090 9649.4 9999.7 10314.7 11084.6 11714.6 12274 12589 13498.7 13849 14408.5 14828 15178.3 15493.3 16333.7 17243.5 17873.5 18503.5 18818.5 19168.7 19798.7 20428.7 20918.9 21269.2 21619.4 22178.9 22808.9 23123.9 23683.3 24242.8 24872.8 25502.8 26132.8 26483 26798 27428 27987.5 28302.5 28652.8 29282.8 29772.9 30123.2 30682.6 31032.9 31383.2 31942.6 32572.6 32887.6 33517.6 34147.6 34567.2 34917.5 35547.5 36177.5 36492.5 36842.8 37472.8 37823 38173.3 38523.6 39083 39433.3 39783.6 40343 40902.5 41252.8 41603 42233 42863" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-weight="bold">Note: The Atari CX24 joystick cannot be installed during initialization.</tspan></text><text y="22569.2" xml:space="preserve"><tspan x="7200 7900.6 8250.8 8951.4 9301.7 10002.2 10352.5 11053.1 11403.4 12452.9 13153.5 13854.1 14484.1 15184.6 15534.9 16164.9 16865.5 17495.5 18125.5 18475.7 18755.5 19385.5 20015.5 20365.7 21206.2 21906.7 22326.3 22676.6 23026.9 23867.3 24147 24847.6 25548.1 26248.7" font-size="1200" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-weight="bold">2.3.1.2 Mouse/Joystick Port Pinout</tspan></text><text y="26169.2" xml:space="preserve"><tspan x="7200 7900.6 8250.8 12000 12700.6 13330.6 13960.6 14520 14870.3 15220.6 15850.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-weight="bold" text-decoration="underline">PinFunction</tspan></text><text y="28569.2" xml:space="preserve"><tspan x="7200 12000 12866.4 13466.4 13800 14666.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">1Up/XB</tspan></text><text y="29769.2" xml:space="preserve"><tspan x="7200 12000 12866.4 13466.4 14332.8 14932.8 15266.4 16132.8" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">2Down/XA</tspan></text><text y="30969.2" xml:space="preserve"><tspan x="7200 12000 12733.2 13266 13665.6 13999.2 14332.8 15199.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">3Left/YA</tspan></text><text y="32169.2" xml:space="preserve"><tspan x="7200 12000 12800.4 13134 13734 14334 14667.6 15001.2 15867.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">4Right/YB</tspan></text><text y="33369.2" xml:space="preserve"><tspan x="7200 12000 12866.4 13466.4 13800 14100 14900.4 15500.4 16100.4 16700.4 17233.2 17766 18099.6 18632.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">5Not Connected</tspan></text><text y="34569.2" xml:space="preserve"><tspan x="7200 12000 12667.2 13000.8 13400.4 13933.2 14266.8 15000 15532.8 15932.4 16266 16566 17366.4 17966.4 18300 18633.6 19233.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">6Fire/Left Button</tspan></text><text y="35769.2" xml:space="preserve"><tspan x="7200 12000 12676.8 12976.8 13576.8 13876.8 14743.2 15609.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">7+ 5 VDC</tspan></text><text y="36969.2" xml:space="preserve"><tspan x="7200 12000 12866.4 13266 13866 14466 15066" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">8Ground</tspan></text><text y="38169.2" xml:space="preserve"><tspan x="7200 12000 12466.8 13066.8 13666.8 14266.8 14566.8 15234 15567.6 15967.2 16500 16833.6 17634 17967.6 18567.6 19167.6 19501.2 19801.2 20601.6 21201.6 21535.2 21868.8 22468.8" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">9Joy1 Fire/Right Button</tspan></text><text y="41769.2" xml:space="preserve"><tspan x="7200 7900.6 8250.8 8951.4 9301.7 10002.2 10352.5 11053.1 11403.4 12033.4 12733.9 13363.9 13993.9 14344.2 14623.9 15253.9 15883.9 16234.2 17074.6 17775.2 18194.8 18545 18895.3 19735.7 20015.5 20716 21416.6 22117.1" font-size="1200" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-weight="bold">2.3.1.3 Joystick Port Pinout</tspan></text><text y="45369.2" xml:space="preserve"><tspan x="7200 7867.2 8200.8 8800.8 9100.8 9400.8 10068 10668 11268 11800.8 12134.4 12468 13068" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">Pin  Function</tspan></text><text y="47769.2" xml:space="preserve"><tspan x="7200 7800 8100 8400 8700 9000 9300 9600 9900 10200 10500 11366.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">1         Up</tspan></text><text y="48969.2" xml:space="preserve"><tspan x="7200 7800 8100 8400 8700 9000 9300 9600 9900 10200 10500 11366.4 11966.4 12832.8" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">2         Down</tspan></text><text y="50169.2" xml:space="preserve"><tspan x="7200 7800 8100 8400 8700 9000 9300 9600 9900 10200 10500 11233.2 11766 12165.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">3         Left</tspan></text><text y="51369.2" xml:space="preserve"><tspan x="7200 7800 8100 8400 8700 9000 9300 9600 9900 10200 10500 11300.4 11634 12234 12834" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">4         Right</tspan></text><text y="52569.2" xml:space="preserve"><tspan x="7200 7800 8100 8400 8700 9000 9300 9600 9900 10200 10500 11300.4 11833.2 12300 12832.8 13232.4 13832.4 14365.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">5         Reserved</tspan></text><text y="53769.2" xml:space="preserve"><tspan x="7200 7800 8100 8400 8700 9000 9300 9600 9900 10200 10500 11167.2 11500.8 11900.4 12433.2 12733.2 13533.6 14133.6 14467.2 14800.8 15400.8" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">6         Fire Button</tspan></text><text y="54969.2" xml:space="preserve"><tspan x="7200 7800 8100 8400 8700 9000 9300 9600 9900 10200 10500 11176.8 11776.8 12076.8 12943.2 13809.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">7         +5 VDC</tspan></text><text y="56169.2" xml:space="preserve"><tspan x="7200 7800 8100 8400 8700 9000 9300 9600 9900 10200 10500 11366.4 11766 12366 12966 13566" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">8         Ground</tspan></text><text y="57369.2" xml:space="preserve"><tspan x="7200 7800 8100 8400 8700 9000 9300 9600 9900 10200 10500 11366.4 11966.4 12300 12600 13400.4 14000.4 14600.4 15200.4 15733.2 16266 16599.6 17132.4" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">9         Not Connected</tspan></text><text y="59769.2" xml:space="preserve"><tspan x="7200 7800 8100 8700 9000 9600 9900 10567.2 11100 11499.6 12032.4 12366 12699.6 13232.4 13566 13866 14265.6 14865.6 15199.2 15732 16131.6 16531.2 17064 17596.8" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">2.3.2 Parallel Interface</tspan></text><text y="62169.2" xml:space="preserve"><tspan x="7200 7933.2 8533.2 9066 9366 9966 10498.8 10898.4 11431.2 11764.8 12098.4 12631.2 12964.8 13264.8 13864.8 14464.8 14864.4 15198 15498 15831.6 16298.4 16598.4 17198.4 17598 17931.6 18865.2 19398 19797.6 20131.2 20464.8 21064.8 21364.8 21698.4 22298.4 22632 23164.8 23764.8 24364.8 24897.6 25497.6 25797.6 26330.4 26797.2 27097.2 27630 27930 28730.4 29263.2 29863.2 30196.8 30596.4 31196.4 31796.4 32130 32662.8 33129.6 33429.6 33763.2 34363.2 34963.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">The parallel port is primarily intended as a Centronics type</tspan></text><text y="63369.2" xml:space="preserve"><tspan x="7200 7800 8199.6 8533.2 9133.2 9466.8 9999.6 10399.2 10699.2 11032.8 11632.8 11966.4 12499.2 12898.8 13298.4 13831.2 14364 14896.8 15196.8 15496.8 16096.8 16696.8 17030.4 17330.4 17863.2 18396 18996 19296 19828.8 20162.4 20629.2 21229.2 21529.2 22129.2 22662 22962 23562 24028.8 24561.6 25161.6 25461.6 25994.4 26461.2 26761.2 27294 27594 28194 28726.8 29326.8 29859.6 30259.2 30792 31125.6 31425.6 32025.6 32625.6 33025.2 33625.2 34225.2 34692 35224.8 35524.8 35924.4 36258" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">printer interface, but can also be used as a general purpose I/O</tspan></text><text y="64569.2" xml:space="preserve"><tspan x="7200 7800 8400 8799.6 9133.2 9433.2 9733.2 10533.6 11066.4 11666.4 12000 12399.6 12999.6 13599.6 13933.2 14466 14932.8 15232.8 15900 16633.2 17433.6 18300 19100.4 19833.6 20133.6 20666.4 21266.4 21866.4 22166.4 22966.8 23833.2 24500.4 25366.8 25666.8 26199.6 26599.2 27132 27432 27898.8 28498.8 29098.8 29698.8 30298.8 30698.4 31032 31564.8 32164.8 32464.8 32764.8 33565.2 34431.6 35098.8 35965.2 36265.2 36598.8 37065.6 37365.6 37765.2 38298 38830.8 39430.8 39730.8 40330.8" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">port. Centronics STROBE and BUSY are supported. BUSY is read by</tspan></text><text y="65769.2" xml:space="preserve"><tspan x="7200 7533.6 8133.6 8666.4 8966.4 10033.2 10700.4 11367.6 11667.6 12200.4 12800.4 13134 13734 14034 14334 15200.4 15733.2 16066.8 16599.6 16899.6 17432.4 18032.4 18632.4 18932.4 19399.2 19732.8 20132.4 20732.4 21332.4 21865.2 22165.2 22632 22965.6 23565.6 24165.6 24698.4 25032 25498.8 25798.8 26331.6 26731.2 27264 27564 28164 28764 29097.6 29697.6 30297.6 30631.2 30931.2 31531.2 32131.2 32431.2 32764.8 33364.8 33897.6 34197.6 35064 36130.8 36730.8 37330.8 37930.8" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">the MFP chip. Data and strobe signals are output by the YM2149</tspan></text><text y="66969.2" xml:space="preserve"><tspan x="7200 7867.2 8534.4 9400.8 9700.8 10233.6 10833.6 11167.2 11767.2 12067.2 12367.2 13233.6 13833.6 14167.2 14467.2 15000 15333.6 15667.2 15967.2 16767.6 17300.4 17900.4 18234 18633.6 19233.6 19833.6 20167.2 20700 21166.8 21466.8 22066.8 22466.4 22800 23400 23733.6 24266.4 24666 25132.8 25432.8 25965.6 26365.2 26898 27198 27730.8 28330.8 29264.4 29864.4 30397.2 30730.8 31064.4 31664.4 31998 32530.8 32830.8 33697.2 34030.8 34364.4 34964.4 35264.4 35598 36198 36531.6" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">PSG chip. Not all Centronics printers are compatible with this</tspan></text><text y="68169.2" xml:space="preserve"><tspan x="7200 7800 8400 8799.6 9133.2 9433.2 9733.2 10466.4 11066.4 11599.2 11899.2 12432 13032 13431.6 13831.2 14364 14964 15297.6 15597.6 15931.2 16531.2 17064 17664 17997.6 18597.6 19197.6 19497.6 20097.6 20697.6 20997.6 21331.2 21931.2 22464 22764 23364 23896.8 24230.4 24763.2 25063.2 25396.8 25730.4 26330.4 26863.2 27330 27630 28096.8 28696.8 29296.8 29896.8 30230.4 30830.4 31130.4 31730.4 32330.4 32664 32964 33496.8 34096.8 34629.6 35162.4 35695.2 36295.2 36595.2 37195.2 37495.2" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">port. The current loading on the data lines should not exceed 2.3</tspan></text><text y="69369.2" xml:space="preserve"><tspan x="7200 8133.6 9000 9300 9600 9999.6 10732.8 11332.8 11666.4 12133.2 12433.2 12966 13566 13965.6 14365.2 14898 15364.8 15964.8 16564.8 17164.8 17764.8 18231.6 18531.6 18865.2 19465.2 19765.2 20298 20598 21198 21498 22098 22698 22998 23598 24198 25131.6 25431.6 25831.2 26364 26830.8 27164.4 27631.2 27964.8 28564.8 28964.4 29264.4 29864.4 30464.4 30798 31131.6 31531.2 32131.2 32731.2 33031.2 33631.2 34231.2 34531.2 34864.8 35464.8" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">mA. (This corresponds to a 2.2k ohm resistor pull-up on the</tspan></text><text y="70569.2" xml:space="preserve"><tspan x="7200 7800 8199.6 8533.2 9133.2 9466.8 9999.6 10399.2 10699.2 11166 11499.6 12099.6 12632.4 13032" font-size="1200" font-family="'Times New Roman', Times, 'Liberation Serif', serif">printer side).</tspan></text></g>
<line x1="28219" y1="27236" x2="28219" y2="27236" fill="none" stroke="#000" stroke-width="50" stroke-linecap="butt" stroke-linejoin="round"/>
